<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>H5P Activity</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 720px;
      background: white;
    }

    #h5p-container {
      width: 100%;
      min-height: 720px;
    }

    #h5p-frame {
      display: block;
      width: 100%;
      min-height: 720px;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="h5p-container"></div>

  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const dataPath = params.get("data");

      if (!dataPath) {
        document.body.innerHTML = "Missing H5P data path.";
        return;
      }

      const response = await fetch(dataPath);

      if (!response.ok) {
        document.body.innerHTML = "Could not load H5P config.";
        return;
      }

      const config = await response.json();

      const iframe = document.createElement("iframe");

      iframe.id = "h5p-frame";
      iframe.src = config.embed_url;
      iframe.title = "Interactive activity";
      iframe.width = "100%";
      iframe.height = config.height || 720;
      iframe.style.minHeight = `${config.height || 720}px`;
      iframe.allowFullscreen = config.allow_fullscreen !== false;
      iframe.allow =
        config.allow ||
        "geolocation *; microphone *; camera *; midi *; encrypted-media *";

      iframe.onload = () => {
        iframe.style.minHeight = `${config.height || 720}px`;

        setTimeout(() => {
          window.dispatchEvent(new Event("resize"));
        }, 300);
      };

      document
        .getElementById("h5p-container")
        .appendChild(iframe);
    }

    init();
  </script>

  <script
    src="https://app.lumi.education/api/v1/h5p/core/js/h5p-resizer.js"
    charset="UTF-8">
  </script>
</body>
</html>
