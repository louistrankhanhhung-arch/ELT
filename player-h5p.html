<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>H5P Activity</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #h5p-container {
      width: 100%;
      height: 100%;
    }

    #h5p-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="h5p-container"></div>

  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const dataPath = params.get("data");

      if (!dataPath) {
        document.body.innerHTML = "Missing H5P data path.";
        return;
      }

      const response = await fetch(dataPath);

      if (!response.ok) {
        document.body.innerHTML = "Could not load H5P config.";
        return;
      }

      const config = await response.json();

      const iframe = document.createElement("iframe");

      iframe.id = "h5p-frame";
      iframe.src = config.embed_url;
      iframe.title = "Interactive activity";
      iframe.height = config.height || 650;
      iframe.allowFullscreen = config.allow_fullscreen !== false;

      document
        .getElementById("h5p-container")
        .appendChild(iframe);
    }

    init();
  </script>
</body>
</html>
