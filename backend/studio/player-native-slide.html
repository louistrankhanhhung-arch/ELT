<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>REH slide</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0B3D25; color:#fff; font:clamp(16px,3vw,34px) system-ui }
body:has(.vocab-deck) { display:block; font:clamp(15px,2vw,24px) system-ui; }
body:has(.vocab-deck) main { margin:auto; }
main { width:min(90%,960px); padding:24px 0 } h1 { font-size:1.45em; margin:0 0 12px }
p { white-space:pre-wrap } img,video { display:block; max-width:100%; max-height:55vh } audio { max-width:100% }
.youtube { display:block; width:min(100%,800px); aspect-ratio:16/9; border:0 }
.slide-canvas { position:relative; width:min(96vw, calc(94vh * 16 / 9)); aspect-ratio:16/9; background:#F7FAF3; color:#18352A; border-radius:10px; overflow:hidden; container-type:inline-size }
.slide-canvas .element { position:absolute; box-sizing:border-box; display:flex; justify-content:center; align-items:center; text-align:center; white-space:pre-wrap; padding:.25em; font-size:clamp(10px, 2.4cqw, 30px); overflow:hidden }
.slide-canvas .element[hidden] { display:none }
.slide-canvas img { width:100%; height:100%; max-height:none; object-fit:contain }
.slide-canvas .icon { font-size:clamp(18px, 6cqw, 72px) }
.slide-canvas button { width:100%; height:100%; font:inherit; background:#286340; border:0; border-radius:8px; color:inherit }
.slide-canvas .audio { color:white }
.slide-canvas button:disabled { opacity:.6 }

.element-vector { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
.shape-label { position:relative; pointer-events:none }
.slide-table { width:100%; height:100%; border-collapse:collapse; table-layout:fixed; font:inherit; color:inherit; background:#fff }
.slide-table td,.slide-table th { border:1px solid #A5BDA0; padding:.2em; overflow-wrap:anywhere; text-align:center }
.slide-table th { background:#E9F2E3; font-weight:700 }
#slideZoom { position:fixed; top:6px; right:6px; z-index:2; min-height:44px; padding:0 12px; border:1px solid #A5BDA0; border-radius:8px; background:#F7FAF3; color:#18352A; font:600 16px system-ui }
@media (max-width:600px) {
  body:has(.slide-canvas) { display:block; }
  .slide-canvas { margin:56px auto 0; }
  .slide-canvas.is-zoomed { width:max(100vw, 560px); margin-inline:0; }
}
</style>
<link rel="stylesheet" href="vocab.css?v=1">
<main><h1></h1><p></p><div id="media"></div></main>
<script src="config.js"></script>
<script src="vocab.js?v=1"></script>
<script src="slide-style.js?v=rotation-1"></script>
<script>
const params = new URLSearchParams(location.search);
const revision = params.get("revision");
function youtubeVideoId(source) {
  const url = new URL(source);
  let id;
  if (url.hostname === "youtu.be") {
    id = url.pathname.split("/")[1];
  } else if (["youtube.com", "www.youtube.com", "m.youtube.com", "www.youtube-nocookie.com"].includes(url.hostname)) {
    id = url.pathname === "/watch"
      ? url.searchParams.get("v")
      : url.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)\/?$/)?.[1];
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id || "") ? id : null;
}

let step = 0;
let vocabBlock = null;
let interactive = params.get("role") === "teacher";
let currentAudio = null;
let items = [];
function applyStep() {
  for (const [element, node] of items) {
    node.hidden = step < element.appear || (element.disappear != null && step >= element.disappear);
    const button = node.querySelector("button");
    if (button) button.disabled = !interactive;
  }
  if (currentAudio && (!interactive || currentAudio.node.hidden)) currentAudio.audio.pause();
}
window.addEventListener("message", event => {
  if (event.source !== parent || event.origin !== location.origin
      || event.data?.type !== "reh-slide-step" || event.data.block !== params.get("block")) return;
  if (step === event.data.step && interactive === event.data.interactive) return;
  step = event.data.step;
  interactive = event.data.interactive;
  if (vocabBlock) {
    window.renderVocab(document.querySelector("main"), vocabBlock.vocab, vocabBlock.title, step, interactive);
    return;
  }
  applyStep();
});
function showElements(elements) {
  const canvas = document.createElement("div");
  canvas.className = "slide-canvas";
  items = elements.map(element => {
    const node = document.createElement("div");
    node.className = "element " + element.kind + (element.kind === "shape" ? " " + element.shape : "");
    Object.assign(node.style, {left:element.x+"%", top:element.y+"%", width:element.width+"%", height:element.height+"%"});
    REHSlideStyle.apply(node, element);
    if (element.kind === "shape") {
      const label = document.createElement("span");
      label.className = "shape-label";
      label.textContent = element.text || "";
      node.append(REHSlideStyle.shape(element), label);
    } else if (element.kind === "table") {
      node.append(REHSlideStyle.table(element));
    } else if (element.kind === "image") {
      const img = document.createElement("img");
      img.src = element.url;
      img.alt = element.text;
      node.append(img);
    } else if (element.kind === "audio") {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-label", element.text ? "Play audio: " + element.text : "Play audio");
      button.textContent = REHSlideStyle.audioLabel(element);
      button.addEventListener("click", () => {
        if (!interactive || node.hidden) return;
        currentAudio?.audio.pause();
        const audio = new Audio(element.url);
        currentAudio = {audio, node};
        button.textContent = REHSlideStyle.audioLabel(element);
        audio.addEventListener("playing", () => button.setAttribute("aria-pressed", "true"));
        for (const event of ["pause", "ended"]) {
          audio.addEventListener(event, () => button.setAttribute("aria-pressed", "false"));
        }
        audio.play().catch(error => {
          if (error.name !== "AbortError" && currentAudio?.audio === audio) button.textContent = "Audio unavailable";
        });
      });
      node.append(button);
    } else {
      if (element.kind === "text") REHSlideStyle.text(node, element);
      else node.textContent = element.text;
    }
    canvas.append(node);
    return [element, node];
  });
  document.querySelector("main").replaceWith(canvas);
  const phone = matchMedia("(max-width: 600px)");
  const zoom = document.createElement("button");
  zoom.id = "slideZoom";
  zoom.type = "button";
  zoom.textContent = "Zoom slide";
  zoom.setAttribute("aria-pressed", "false");
  zoom.hidden = !phone.matches;
  zoom.onclick = () => {
    const enlarged = canvas.classList.toggle("is-zoomed");
    zoom.textContent = enlarged ? "Fit slide" : "Zoom slide";
    zoom.setAttribute("aria-pressed", String(enlarged));
    if (!enlarged) window.scrollTo(0, 0);
  };
  phone.addEventListener("change", () => { zoom.hidden = !phone.matches; });
  document.body.append(zoom);
  applyStep();
  parent.postMessage({ type:"reh-slide-ready" }, location.origin);
}

async function showSlide() {
  if (!/^[a-f0-9]{32}$/.test(revision || "")) throw new Error("Invalid slide");
  const response = await fetch(window.runtimeLessonUrl("imports/" + revision));
  if (!response.ok) throw new Error("Slide unavailable");
  const lesson = await response.json();
  const block = lesson.blocks.find(block => block.id === params.get("block") && block.activity_kind === "native-slide");
  if (!block) throw new Error("Slide not found");
  if (block.vocab) {
    vocabBlock = block;
    window.renderVocab(document.querySelector("main"), block.vocab, block.title, step, interactive);
    parent.postMessage({type: "reh-slide-ready"}, location.origin);
    return;
  }
  if (block.elements?.length) { showElements(block.elements); return; }
  document.querySelector("h1").textContent = block.title;
  document.querySelector("p").textContent = block.body;
  if (block.media_url) {
    const id = block.media_type === "video" ? youtubeVideoId(block.media_url) : null;
    if (id) {
      const frame = document.createElement("iframe");
      frame.className = "youtube";
      frame.title = "YouTube video: " + block.title;
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "encrypted-media; picture-in-picture; fullscreen";
      frame.allowFullscreen = true;
      frame.src = "https://www.youtube.com/embed/" + id + "?playsinline=1";
      document.getElementById("media").append(frame);
      return;
    }
    const media = document.createElement(block.media_type === "image" ? "img" : block.media_type);
    if (block.media_type === "image") media.alt = block.title;
    else { media.controls = true; media.preload = "metadata"; }
    media.src = block.media_url;
    document.getElementById("media").append(media);
  }
}
showSlide().catch(error => { document.querySelector("h1").textContent = error.message; });
</script>
</html>
