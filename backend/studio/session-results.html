<!doctype html>
<html lang="en" class="reh-page">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Results | REH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F7FAF3;color:#18352A;font:16px system-ui}
main{max-width:1050px;margin:auto;padding:20px}section,article{background:#fff;border:1px solid #CCDCC8;border-radius:10px;padding:16px;margin:14px 0}
h1,h2,h3{margin:0 0 8px}button{border:0;border-radius:6px;background:#286340;color:white;padding:8px 12px;margin:4px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}button.danger{background:#9e2c2c}input,select,textarea{font:inherit;padding:6px;max-width:100%}
label{display:inline-block;margin:4px 8px 4px 0}textarea{display:block;width:100%;min-height:60px}summary{cursor:pointer;font-weight:600}
details{padding:8px 0;border-top:1px solid #CCDCC8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}audio{max-width:100%}
#sessionList{list-style:none;padding:0}#sessionList li{display:flex;align-items:center;gap:8px;border-top:1px solid #CCDCC8;padding:4px 0}
#sessionList button{text-align:left;flex:1;min-width:0;background:#F7FAF3;color:#18352A}
#sessionList small{display:block;color:#456052}#historyTools{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#historyFilters{padding:8px 0}#deleteSessionsDialog{max-width:min(480px,92vw);border:1px solid #CCDCC8;border-radius:12px;padding:20px}
#deleteSessionsDialog::backdrop{background:#0B3D2599} [hidden]{display:none!important}
#historyPages button[aria-current="page"]{background:#18352A;color:white;font-weight:700}
</style>
<link rel="stylesheet" href="runtime-ui.css?v=reh-1">
<main>
<a href="teacher-home.html">Teacher home</a><h1>Session Results</h1>
<p>Reopen a classroom session to review and export saved evidence.</p>
<section>
<label>Staging teacher access code <input id="token" type="password" autocomplete="off"></label>
<button id="load">Load session history</button><p id="status" role="status"></p>
</section>
<section id="history" hidden>
<h2>Session history</h2>
<div id="historyTools">
<button id="toggleFilters" type="button" aria-expanded="false" aria-controls="historyFilters">Filter</button>
<label><input id="selectPage" type="checkbox"> Select page</label>
<button id="deleteSessions" class="danger" type="button" disabled>Delete selected</button>
</div>
<form id="historyFilters" hidden>
<label>Lesson or PIN <input id="historyQuery" type="search" maxlength="160"></label>
<label>Status <select id="historyStatus"><option value="">All statuses</option><option value="active">Active</option><option value="ended">Ended</option><option value="expired">Expired</option></select></label>
<button>Apply filters</button><button id="clearFilters" type="button">Clear</button>
</form>
<p id="historyEmpty" hidden>No matching sessions.</p>
<ul id="sessionList"></ul>
<dialog id="deleteSessionsDialog" aria-labelledby="deleteSessionsTitle">
<h2 id="deleteSessionsTitle">Delete sessions?</h2>
<p id="deleteSessionsSummary"></p>
<p>This permanently removes their responses, scores and recordings. Download any archives you want to keep first.</p>
<form method="dialog"><button value="cancel" autofocus>Cancel</button><button class="danger" id="confirmDeleteSessions" value="delete">Delete permanently</button></form>
</dialog>
<nav aria-label="Session history pages"><button id="previous" disabled>Previous</button><span id="historyPages"></span><button id="next" disabled>Next</button></nav>
</section>
<section id="detail" hidden>
<h2 id="sessionTitle"></h2><p id="sessionSummary"></p>
<label>Student <select id="studentFilter"><option value="">All students</option></select></label>
<button id="archive">Download archive</button>
<details id="deletePanel" hidden>
<summary>Delete archived audio</summary>
<p id="deleteSummary"></p>
<label><input type="checkbox" id="verified"> I opened the ZIP and verified that the original recordings are saved.</label>
<label>Type DELETE AUDIO <input id="confirmation" autocomplete="off"></label>
<button class="danger" id="deleteAudio" disabled>Delete audio permanently</button>
</details>
<div id="tasks"></div>
</section>
</main>
<script src="config.js"></script>
<script src="session-results.js?v=text-assessment-1"></script>
</html>
