<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mountain Climb | REH</title>
<link rel="stylesheet" href="runtime-ui.css?v=reh-nav-1">
<style>
body { margin: 0; min-height: 100dvh; color: #18352a; background: #edf4ea; }
main { max-width: 1150px; margin: auto; padding: clamp(14px, 3vw, 36px); }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -.04em; }
#mode { font-size: 1.1rem; margin: 4px 0 0; }
#status { color: #456052; font-weight: 650; }
#lanes { display: grid; gap: 12px; }
.lane { border: 1px solid #cbdcc8; border-radius: 16px; padding: clamp(10px,2vw,18px); background: #fff; }
.lane h2 { margin: 0; font-size: clamp(1.1rem, 3vw, 1.55rem); }
.lane strong { white-space: nowrap; }
.course { position: relative; height: 96px; margin-top: 6px; overflow: hidden; border-radius: 10px; background: linear-gradient(#e0eff1, #f3f7e6); }
.ridge { position: absolute; inset: 0; background: #bfd8ad; clip-path: polygon(0 88%, 13% 67%, 23% 82%, 43% 53%, 51% 66%, 71% 27%, 78% 40%, 95% 6%, 100% 18%, 100% 100%, 0 100%); }
.trail { position: absolute; inset: 0; background: #fff; clip-path: polygon(6% 66%, 94% 22%, 94% 25%, 6% 69%); }
.climber { position: absolute; left: calc(6% + var(--progress, 0) * 88%); top: calc(67% - var(--progress, 0) * 44%); transform: translate(-50%, -50%); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #fff; background: var(--team); color: #fff; font-weight: 750; box-shadow: 0 2px 5px #18352a38; transition: left .7s ease, top .7s ease; }
.finish { position: absolute; right: 4%; top: 5%; color: #18352a; font-size: 1.5rem; }
#winners { font-size: clamp(1.1rem, 4vw, 1.75rem); font-weight: 750; margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .climber { transition: none; } }
</style>
</head>
<body>
<main>
<header><div><h1>Mountain Climb</h1><p id="mode"></p></div><p id="status" role="status">Loading race…</p></header>
<div id="lanes"></div><p id="winners" aria-live="polite"></p>
</main>
<script src="config.js"></script>
<script src="race.js?v=1"></script>
</body></html>
