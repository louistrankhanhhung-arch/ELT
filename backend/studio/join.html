<!DOCTYPE html>
<html lang="en" class="reh-join">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join ELT Session</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7FAF3;
      font-family: system-ui, "Segoe UI", sans-serif;
      color: #18352A;
      padding: 16px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }

    p {
      margin-top: 0;
      margin-bottom: 24px;
      color: #456052;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #CCDCC8;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #18352A;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      margin-top: 16px;
      color: #b00020;
      font-size: 14px;
    }

    .success {
      margin-top: 16px;
      color: #286340;
      font-size: 14px;
    }
  </style>
<link rel="stylesheet" href="runtime-ui.css?v=reh-1">
</head>
<body>
  <main class="card">
    <h1>Join Screen</h1>
    <p>Enter your Student ID and PIN.</p>
    <form id="joinForm">
      <div class="field">
        <label for="studentId">Student ID</label>
        <input id="studentId" name="student_id" maxlength="120" placeholder="Enter your Student ID" required>
      </div>
      <div class="field">
        <label for="pin">PIN</label>
        <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}([0-9]{4})?" maxlength="8" required>
      </div>
      <button id="joinBtn" type="submit">Join</button>
    </form>
    <div id="message" class="error" role="status"></div>
  </main>
  <script src="./config.js?v=2"></script>
  <script>
    const form = document.getElementById("joinForm");
    const pin = document.getElementById("pin");
    const button = document.getElementById("joinBtn");
    const message = document.getElementById("message");
    const api = window.ELT_CONFIG.API_BASE;
    const base = window.ELT_CONFIG.BASE_URL;
    const linked = new URLSearchParams(location.search).get("pin");
    if (/^(?:[0-9]{4}|[0-9]{8})$/.test(linked || "")) pin.value = linked;

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Joining…";
      message.textContent = "";
      const data = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch(api + "/join", {
          method: "POST", cache: "no-store", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({pin: data.pin.trim(), student_id: data.student_id.trim()})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : "Check your PIN and Student ID.");
        if (result.kind === "classroom") {
          const target = new URL("student.html", base);
          target.search = new URLSearchParams({pin: data.pin, student_id: result.student_id});
          location.assign(target);
        } else if (result.kind === "homework" || result.kind === "test") {
          sessionStorage.setItem("reh-" + result.kind + "-access:" + data.pin, result.access);
          const target = new URL(result.kind + ".html", base);
          target.search = new URLSearchParams({join: "1", pin: data.pin});
          location.assign(target);
        } else throw new Error("The PIN could not be routed.");
      } catch (error) {
        message.textContent = error.message || "Could not join. Try again.";
        button.disabled = false;
        button.textContent = "Join";
      }
    });
  </script>
</body>
</html>
