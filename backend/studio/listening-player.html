<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REH Listening Audio</title>
<style>
body { background: #f4f7f3; color: #18352a; font: 1rem system-ui, sans-serif; margin: 0; padding: 24px; }
main { background: white; border: 1px solid #d3e0d6; border-radius: 12px; padding: 24px; max-width: 36rem; margin: 2rem auto; }
h1 { margin-top: 0; } input, audio { display: block; max-width: 100%; margin-top: 14px; }
</style>
</head>
<body>
<main>
<h1>Listening audio</h1>
<p>Choose a local file. In Online Classroom, share this browser tab with tab audio enabled, then press Play.</p>
<label for="file">Audio file</label>
<input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.opus,.aac">
<audio id="audio" controls hidden></audio>
<p id="status" role="status"></p>
</main>
<script>
const input = document.getElementById("file");
const player = document.getElementById("audio");
const status = document.getElementById("status");
let source;
input.onchange = () => {
  const file = input.files[0];
  if (!file) return;
  player.pause();
  if (source) URL.revokeObjectURL(source);
  source = URL.createObjectURL(file);
  player.src = source;
  player.hidden = false;
  status.textContent = file.name;
};
player.onerror = () => { status.textContent = "This browser could not play the file. Try MP3 or WAV."; };
</script>
</body>
</html>
