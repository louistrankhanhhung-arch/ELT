<!DOCTYPE html>
<html lang="en" class="reh-student">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELT Student Runtime</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: #F7FAF3;
      font-family: system-ui, "Segoe UI", sans-serif;
      color: #18352A;
      overflow: hidden;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      background: #ffffff;
      border-bottom: 1px solid #CCDCC8;
      font-size: 14px;
    }

    .lesson-info {
      min-width: 0;
    }

    .lesson-title {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-title {
      color: #456052;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .status {
      flex: 0 0 auto;
      font-size: 13px;
      color: #456052;
    }

    .nav-controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 6px 10px;
      border: 1px solid #CCDCC8;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      font-size: 13px;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .runtime {
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: block;
    }

    .error {
      padding: 20px;
      font-size: 16px;
      color: #b00020;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 6px 10px;
        font-size: 13px;
      }

      .status {
        display: none;
      }

      .nav-btn {
        padding: 5px 8px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .topbar {
        padding: 4px 8px;
        font-size: 12px;
      }
      .block-title {
        display: none;
      }
    }
    #writingPanel {
      box-sizing: border-box;
      margin: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #CCDCC8;
      border-radius: 10px;
      color: #18352A;
      overflow: auto;
      max-height: 40vh;
      flex-shrink: 0;
    }
    #writingPanel > summary { cursor: pointer; font-weight: 650; }
    #writingPanel h2 { margin: 0 0 8px; font-size: 1.1rem; }
    #writingPanel form { margin: 10px 0; }
    #writingPanel textarea {
      box-sizing: border-box;
      display: block;
      width: min(100%, 48rem);
      margin: 6px 0 10px;
      padding: 9px 10px;
      border: 1px solid #A5BDA0;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
    }
    #writingPanel button {
      background: #286340;
      border: 0;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    #writingPanel button:disabled { opacity: .55; cursor: default; }
    #writingPanel p { margin: 8px 0; }
    #writingPanel p:empty { display: none; }
    #writingResults details { border-top: 1px solid #CCDCC8; padding: 8px 0; }
    #writingResults summary { cursor: pointer; }
    body.presentation-mode #writingPanel { display: none; }
      #publishedScores { flex: 0 0 auto; max-height: 42vh; overflow: auto; padding: 10px 16px; background: white; border-bottom: 1px solid #CCDCC8; }
    #publishedScores article { max-width: 850px; margin-inline: auto; }
    .score-header, .score-question { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    #publishedScores:has(.writing-score-feedback) { flex:1 1 0; min-height:0; max-height:none; }
    body:has(#publishedScores:not([hidden]) .writing-score-feedback) :is(#writingPanel, .runtime) { display:none; }
    .writing-score-feedback { padding: 12px; background: #E9F2E3; border-radius: 8px; }
    .score-header h2, #publishedScores article > p { margin: 4px 0 10px; }
    .score-points { background: #E9F2E3; color: #286340; padding: 7px 14px; border-radius: 10px; font-size: 1.35rem; }
    .score-toggle { padding: 8px 12px; background: white; border: 1px solid #A5BDA0; border-radius: 8px; color: #18352A; cursor: pointer; }
    .score-review { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 10px; }
    .score-review li { padding: 12px; border: 1px solid #CCDCC8; border-radius: 10px; overflow-wrap: anywhere; }
    .score-review li[data-correct="false"] { border-inline-start: 4px solid #ad651f; }
    .score-badge { padding: 3px 8px; border-radius: 20px; color: #286340; background: #E9F2E3; font-size: .8rem; font-weight: 650; }
    [data-correct="false"] .score-badge { color: #773c09; background: #fff0dc; }
    .score-comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 185px), 1fr)); gap: 8px; margin: 10px 0 0; }
    .score-comparison > div { min-width: 0; background: #F7FAF3; padding: 8px; border-radius: 7px; }
    .score-comparison > div + div { background: #E9F2E3; }
    .score-comparison dt { font-size: .8rem; color: #456052; font-weight: 650; }
    .score-comparison dd { margin: 4px 0 0; white-space: pre-wrap; }
    /* Written activities use the viewport below the lesson header. */
    body:has(#writingPanel:not([hidden]):not([data-speaking])) {
      height: 100dvh;
    }
    body:has(#writingPanel:not([hidden]):not([data-speaking])) .runtime {
      display: none;
    }
    #writingPanel:not([data-speaking]) {
      flex: 1 1 0;
      min-height: 0;
      max-height: none;
      margin: clamp(6px, 2vw, 12px);
      padding: clamp(10px, 3vw, 20px);
      overflow-y: auto;
    }
    body:has(#pageTaskPicker:not([hidden])) #writingPanel:not([hidden]) { flex: 1 1 0; min-height: 0; max-height: none; }
    body:has(#pageTaskPicker:not([hidden])) .runtime { display: none; }
    body:has(#writingPanel:not([hidden]) #writingMaterials:not(:empty)) .runtime { display: none; }
    #writingPanel:has(#writingMaterials:not(:empty)) { flex: 1 1 0; min-height: 0; max-height: none; }
    #quizChoices, #quizChoices > fieldset {
      min-inline-size: 0;
      overflow-wrap: anywhere;
    }
    #quizChoices {
      border: 0;
      margin: 0;
      padding: 0;
    }
    #quizChoices > fieldset {
      border: 1px solid #CCDCC8;
      border-radius: 8px;
      margin: 0 0 12px;
      padding: 8px 12px;
    }
    #quizChoices input[data-typed-answer] { box-sizing: border-box; max-width: 100%; width: min(100%, 32rem); padding: 8px; font: inherit; }
    .order-parts { padding-inline-start: 1.6em; }
    .order-parts li { margin-block: 6px; padding: 8px; border: 1px solid #CCDCC8; border-radius: 8px; }
    .order-parts button { min-width: 42px; min-height: 42px; }
    .sentence-parts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    .sentence-parts li { margin: 0; padding: 0; border: 0; max-width: 100%; }
    .paragraph-parts { list-style: none; padding: 0; }
    .paragraph-parts li { padding: 0; border: 0; }
    .paragraph-parts button { width: 100%; text-align: left; }
    #writingPanel .order-parts button { color: #18352A; background: #E9F2E3; border: 1px solid #A5BDA0; cursor: grab; max-width: 100%; overflow-wrap: anywhere; }
    #writingPanel .order-parts button[aria-pressed="true"] { background: #E9F2E3; border-color: #286340; outline: 2px solid #286340; }
    #dialogueCard { flex: 1 1 0; min-height: 0; overflow: auto; margin: 10px; padding: clamp(14px, 4vw, 32px); background: #fff; border: 1px solid #CCDCC8; border-radius: 12px; }
    #dialogueCard h2 { color: #286340; margin-top: 0; }
    #dialogueCard p { white-space: pre-wrap; overflow-wrap: anywhere; }
    body:has(#dialogueCard:not([hidden])) .runtime { display: none; }
    #quizChoices label {
      min-height: 36px;
      padding: 4px 0;
      box-sizing: border-box;
    }
    body:has(#writingPanel:not([hidden]) #quizChoices:not([hidden])):has(#publishedScores:not([hidden])) #publishedScores {
      flex: 1 1 0;
      min-height: 0;
      max-height: none;
    }
    body:has(#publishedScores:not([hidden])) #writingPanel:has(#quizChoices:not([hidden])) {
      display: none;
    }
  </style>

<body>
  <header class="topbar">
    <div class="lesson-info">
      <div class="lesson-title" id="lessonTitle">Loading lesson...</div>
      <div class="block-title" id="blockTitle">Loading block...</div>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" id="completeBtn">Complete</button>
      <button class="nav-btn" id="prevBtn">← Prev</button>
      <button class="nav-btn" id="nextBtn">Next →</button>
      <div class="status" id="statusText">Student runtime</div>
    </div>
  </header>
  <label id="pageTaskPicker" hidden style="padding:8px 12px">Your tasks <select id="pageTaskSelect" style="max-width:100%"></select></label>
  <section id="dialogueCard" hidden aria-label="Dialogue card"></section>
  <section id="publishedScores" hidden aria-label="Task results"></section>
  <section id="writingPanel" hidden>
    <h2 id="taskHeading">Writing</h2>
    <p id="writingPrompt" style="white-space:pre-wrap"></p>
    <div id="writingMaterials"></div>
    <form id="writingForm">
      <label id="writingInput">Response <textarea name="response" rows="10" maxlength="20000" required></textarea></label>
      <fieldset id="quizChoices" hidden><legend>Choose one answer</legend></fieldset>
      <button type="submit">Submit response</button>
    </form>
    <div id="speakingPanel" hidden>
      <button type="button" id="recordAudio">Record</button>
      <button type="button" id="stopAudio" disabled>Stop recording</button>
      <audio id="audioPreview" controls hidden></audio>
      <button type="button" id="submitAudio" disabled>Submit recording</button>
      <p>Record up to 2 minutes. Listen to your recording before submitting.</p>
    </div>
    <p id="writingStatus" role="status"></p>
  </section>

  <main class="runtime">
    <iframe id="playerFrame"></iframe>
    <p id="focusMessage" hidden role="status">Please look at the board.</p>
    <div class="error" id="errorBox" style="display:none;"></div>
  </main>

  <script src="./config.js?v=2"></script>
<script src="task-materials.js?v=1"></script>
  <script>
    const BASE_URL =
      window.ELT_CONFIG?.BASE_URL ||
      "https://rootenglishhouse.com/";

    const params = new URLSearchParams(window.location.search);

    const API_BASE =
      window.ELT_CONFIG?.API_BASE ||
      "https://elt-production.up.railway.app/api";

    const sessionPin = params.get("pin");
    const studentId = params.get("student_id");

    const lessonPath =
      params.get("lesson") ||
      "lessons/g1rec/l02/g1rec-l02.json";

    let blockIndex = Number(params.get("block") || 0);

    const lessonUrl = window.runtimeLessonUrl(lessonPath);

    const lessonTitle = document.getElementById("lessonTitle");
    const blockTitle = document.getElementById("blockTitle");
    const statusText = document.getElementById("statusText");
    const playerFrame = document.getElementById("playerFrame");
    const errorBox = document.getElementById("errorBox");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const completeBtn = document.getElementById("completeBtn");

    let currentLesson = null;
    let lastSessionBlockIndex = null;
    let displayMode = "follow";
    let slideStep = 0;

    function showSlideStep() {
      const block = currentLesson?.blocks[blockIndex];
      playerFrame.contentWindow?.postMessage({ type: "reh-slide-step", block: block?.id,
        step: slideStep, interactive: !sessionPin || displayMode === "interact" }, location.origin);
    }
    playerFrame.addEventListener("load", showSlideStep);
    window.addEventListener("message", event => {
      if (event.origin === location.origin && event.source === playerFrame.contentWindow
          && event.data?.type === "reh-slide-ready") showSlideStep();
    });
    const writingPanel = document.getElementById("writingPanel");
    const writingForm = document.getElementById("writingForm");
    const writingStatus = document.getElementById("writingStatus");
    let writingTaskId = null;
    let isQuiz = false;
    let isSpeaking = false;
    const speakingPanel = document.getElementById("speakingPanel");
    const recordAudio = document.getElementById("recordAudio");
    const stopAudio = document.getElementById("stopAudio");
    const submitAudio = document.getElementById("submitAudio");
    const audioPreview = document.getElementById("audioPreview");
    const audioDrafts = new Map();
    let recorder = null;
    let recordingTaskId = null;
    let recordingTimer = null;
    let previewBlob = null;
    let previewUrl = "";
    let audioSubmitting = false;

    function updateAudioControls() {
      const draft = audioDrafts.get(writingTaskId);
      if (previewBlob !== draft) {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewBlob = draft;
        previewUrl = draft ? URL.createObjectURL(draft) : "";
        if (previewUrl) audioPreview.src = previewUrl;
        else audioPreview.removeAttribute("src");
      }
      audioPreview.hidden = !draft;
      recordAudio.disabled = Boolean(recordingTaskId);
      stopAudio.disabled = !recorder || recorder.state !== "recording";
      submitAudio.disabled = !draft || Boolean(recordingTaskId) || audioSubmitting;
    }

    function stopRecording() {
      if (recorder?.state === "recording") recorder.stop();
    }

    recordAudio.addEventListener("click", async () => {
      if (!isSpeaking || writingPanel.hidden || recordingTaskId) return;
      const taskId = writingTaskId;
      recordingTaskId = taskId;
      updateAudioControls();
      let stream;
      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          throw new Error("Recording is not available in this browser.");
        }
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (taskId !== writingTaskId || writingPanel.hidden) {
          stream.getTracks().forEach(track => track.stop());
          recordingTaskId = null;
          updateAudioControls();
          return;
        }
        const mimeType = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"]
          .find(type => MediaRecorder.isTypeSupported(type));
        if (!mimeType) throw new Error("This browser does not support a compatible recording format.");
        const current = new MediaRecorder(stream, { mimeType });
        const chunks = [];
        recorder = current;
        current.addEventListener("dataavailable", event => {
          if (event.data.size) chunks.push(event.data);
        });
        current.addEventListener("error", () => {
          chunks.length = 0;
          if (taskId === writingTaskId) writingStatus.textContent = "Recording failed. Please try again.";
        });
        current.addEventListener("stop", () => {
          clearTimeout(recordingTimer);
          stream.getTracks().forEach(track => track.stop());
          const blob = new Blob(chunks, { type: (current.mimeType || mimeType).split(";")[0] });
          recorder = null;
          recordingTaskId = null;
          if (blob.size && blob.size <= 5 * 1024 * 1024) {
            audioDrafts.set(taskId, blob);
            if (taskId === writingTaskId) writingStatus.textContent = "Recording ready. Listen or record again.";
          } else if (taskId === writingTaskId) {
            writingStatus.textContent = "No usable recording. Try again with a shorter recording.";
          }
          updateAudioControls();
        });
        current.start();
        recordingTimer = setTimeout(stopRecording, 120000);
        writingStatus.textContent = "Recording…";
        updateAudioControls();
      } catch (error) {
        stream?.getTracks().forEach(track => track.stop());
        recorder = null;
        recordingTaskId = null;
        if (taskId === writingTaskId) {
          writingStatus.textContent = error.name === "NotAllowedError"
            ? "Microphone access was denied. Allow it to record."
            : error.message;
        }
        updateAudioControls();
      }
    });
    stopAudio.addEventListener("click", stopRecording);

    submitAudio.addEventListener("click", async () => {
      const taskId = writingTaskId;
      const blob = audioDrafts.get(taskId);
      if (!blob || writingPanel.hidden || audioSubmitting || submittedTasks.has(taskId)) return;
      audioSubmitting = true;
      updateAudioControls();
      try {
        const encoded = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const response = await fetch(`${API_BASE}/sessions/${sessionPin}/tasks/${taskId}/speaking`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ student_id: studentId, media_type: blob.type, audio_base64: encoded })
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(typeof result.detail === "string" ? result.detail : "Could not submit the recording.");
        }
        submittedTasks.add(taskId);
        audioDrafts.delete(taskId);
        if (taskId === writingTaskId) {
          speakingPanel.hidden = true;
          writingStatus.textContent = "Recording submitted.";
        }
      } catch (error) {
        if (taskId === writingTaskId) writingStatus.textContent = "Recording not sent. You can retry. " + error.message;
      } finally {
        audioSubmitting = false;
        updateAudioControls();
      }
    });
    let scoreRequestKey = "";
    const publishedScores = document.getElementById("publishedScores");

    const dialogueCard = document.getElementById("dialogueCard");
    function renderDialogueCard(card) {
      const show = card && displayMode !== "focus";
      dialogueCard.hidden = !show;
      const key = show ? JSON.stringify(card) : "";
      if (key === dialogueCard.dataset.card) return;
      dialogueCard.dataset.card = key;
      dialogueCard.replaceChildren();
      if (!show) return;
      for (const [tag, value] of [
        ["h2", "Role " + card.role],
        ["p", "Group " + card.group_number + " · " + card.partners.map(partner => partner.name + " (Role " + partner.role + ")").join(", ")],
        ["p", card.instructions],
        ["p", card.card],
        ["small", card.partners.length > 1 ? "If two people share a role, take turns." : ""]
      ]) {
        if (!value) continue;
        const node = document.createElement(tag);
        node.textContent = value;
        dialogueCard.append(node);
      }
      for (const [label, materials] of [["Shared materials", card.shared_materials], ["Role " + card.role + " materials", card.materials]]) {
        if (!materials?.length) continue;
        const heading = document.createElement("h3");
        heading.textContent = label;
        dialogueCard.append(heading);
        window.renderTaskMaterials(dialogueCard, materials);
      }
    }

    const pageTaskPicker = document.getElementById("pageTaskPicker");
    const pageTaskSelect = document.getElementById("pageTaskSelect");
    let pageTaskState;
    pageTaskSelect.addEventListener("change", () => { if (pageTaskState) syncBlockTask(pageTaskState); });

    function syncBlockTask(session) {
      renderDialogueCard(session.dialogue_card);
      pageTaskState = session;
      const tasks = session.page_tasks || [];
      for (const task of tasks) if (task.submitted) submittedTasks.add(task.task_id);
      const selected = pageTaskSelect.value;
      const options = tasks.map(task => [task.task_id, task.title + (submittedTasks.has(task.task_id) ? " · Submitted" : "")]);
      if (JSON.stringify(options) !== pageTaskSelect.dataset.options) {
        pageTaskSelect.replaceChildren(...options.map(([id, label]) => new Option(label, id)));
        pageTaskSelect.dataset.options = JSON.stringify(options);
        pageTaskSelect.value = tasks.some(task => task.task_id === selected) ? selected
          : tasks.find(task => !submittedTasks.has(task.task_id))?.task_id || tasks[0]?.task_id || "";
      }
      pageTaskPicker.hidden = !tasks.length;
      const block = currentLesson?.blocks[blockIndex];
      const active = session.active_writing_task;
      const pageTask = tasks.find(task => task.task_id === pageTaskSelect.value);
      const task = pageTask || (block && active && (!active.block_id || active.block_id === block.id) ? active : null);
      syncWriting(task, Boolean(pageTask));
      void syncScores(task?.task_id, session.published_score_ids);
    }

    async function syncScores(taskId, publishedIds) {
      if (!studentId || !taskId || !publishedIds?.includes(taskId)) {
        scoreRequestKey = "";
        publishedScores.hidden = true;
        publishedScores.replaceChildren();
        return;
      }
      const ids = [taskId];
      const key = JSON.stringify(ids) + ":" + submittedTasks.size;
      if (key === scoreRequestKey) return;
      scoreRequestKey = key;
      if (publishedScores.firstElementChild?.dataset.taskId !== taskId) {
        publishedScores.hidden = true;
        publishedScores.replaceChildren();
      }
      try {
        const response = await fetch(`${API_BASE}/sessions/${sessionPin}/published-scores`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ student_id: studentId })
        });
        if (!response.ok) throw new Error("Could not load scores");
        const result = await response.json();
        if (scoreRequestKey !== key) return;
        const scores = result.scores.filter(score => score.task_id === taskId);
        publishedScores.hidden = !scores.length;
        publishedScores.replaceChildren(...scores.map(score => {
          const card = document.createElement("article");
          card.dataset.taskId = score.task_id;
          const header = document.createElement("div");
          header.className = "score-header";
          const title = document.createElement("h2");
          title.textContent = "Your results";
          const points = document.createElement("strong");
          points.className = "score-points";
          points.textContent = `${score.score} / ${score.max_score}`;
          header.append(title, points);
          const note = document.createElement("p");
          if (score.feedback) {
            note.textContent = "Writing feedback";
            const feedback = document.createElement("p");
            feedback.className = "writing-score-feedback";
            feedback.textContent = score.feedback;
            card.append(header, note, feedback);
            return card;
          }
          const items = score.items || [];
          const mistakes = items.filter(item => !item.is_correct).length;
          note.textContent = !items.length ? "Your score has been published."
            : mistakes ? `${mistakes} ${mistakes === 1 ? "answer" : "answers"} to review. Compare your answer with the expected answer below.`
            : "All answers are correct.";
          card.append(header, note);
          if (!items.length) return card;

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "score-toggle";
          const list = document.createElement("ol");
          list.className = "score-review";
          items.forEach((item, index) => {
            const row = document.createElement("li");
            row.dataset.correct = String(item.is_correct);
            const heading = document.createElement("div");
            heading.className = "score-question";
            const prompt = document.createElement("strong");
            prompt.textContent = `${index + 1}. ${item.prompt}`;
            const badge = document.createElement("span");
            badge.className = "score-badge";
            badge.textContent = item.is_correct ? "Correct" : "Try again";
            heading.append(prompt, badge);
            row.append(heading);
            const comparison = document.createElement("dl");
            comparison.className = "score-comparison";
            function appendAnswer(label, value) {
              const pair = document.createElement("div");
              const caption = document.createElement("dt");
              caption.textContent = label;
              const answer = document.createElement("dd");
              answer.textContent = value;
              pair.append(caption, answer);
              comparison.append(pair);
            }
            appendAnswer("Your answer", item.selected_option);
            if (!item.is_correct) appendAnswer("Expected answer", item.correct_option);
            row.append(comparison);
            list.append(row);
          });
          let showAll = !mistakes;
          function updateReview() {
            for (const row of list.children) row.hidden = !showAll && row.dataset.correct === "true";
            toggle.textContent = showAll ? "Show answers to review" : "Show all answers";
          }
          if (mistakes && mistakes < items.length) {
            toggle.addEventListener("click", () => { showAll = !showAll; updateReview(); });
            card.append(toggle);
          }
          updateReview();
          card.append(list);
          return card;
        }));
      } catch {
        if (scoreRequestKey === key) scoreRequestKey = "";
      }
    }

    function optionOrder(task, question, questionIndex) {
      const order = question.options.map((_, index) => index);
      if (!task.shuffle) return order;
      const seed = `${studentId}:${task.task_id}:${questionIndex}`;
      let state = 2166136261;
      for (const character of seed) state = Math.imul(state ^ character.charCodeAt(0), 16777619);
      for (let i = order.length - 1; i > 0; i--) {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const j = state % (i + 1);
        [order[i], order[j]] = [order[j], order[i]];
      }
      return order;
    }

    function renderOrderingParts(parts, draft, sentence) {
      const list = document.createElement("ul");
      list.className = "order-parts " + (sentence ? "sentence-parts" : "paragraph-parts");
      let selected;
      let dragged;

      function select(row) {
        selected?.firstElementChild.setAttribute("aria-pressed", "false");
        selected = row;
        selected?.firstElementChild.setAttribute("aria-pressed", "true");
      }

      function move(row, target) {
        if (!target || row === target) return;
        const rows = [...list.children];
        if (rows.indexOf(row) < rows.indexOf(target)) target.after(row);
        else target.before(row);
      }

      for (const index of Array.isArray(draft) ? draft : parts.map((_, index) => index)) {
        const row = document.createElement("li");
        row.dataset.part = index;
        row.draggable = true;
        const chip = document.createElement("button");
        chip.type = "button";
        chip.textContent = parts[index];
        chip.setAttribute("aria-pressed", "false");
        chip.addEventListener("click", () => {
          if (selected && selected !== row) {
            const marker = document.createComment("");
            selected.replaceWith(marker);
            row.replaceWith(selected);
            marker.replaceWith(row);
            select(null);
            chip.focus();
          } else {
            select(selected === row ? null : row);
          }
        });
        chip.addEventListener("keydown", event => {
          const previous = sentence ? "ArrowLeft" : "ArrowUp";
          const next = sentence ? "ArrowRight" : "ArrowDown";
          if (event.key !== previous && event.key !== next) return;
          event.preventDefault();
          move(row, event.key === previous ? row.previousElementSibling : row.nextElementSibling);
          chip.focus();
        });
        row.addEventListener("dragstart", event => {
          select(null);
          dragged = row;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(index));
        });
        row.addEventListener("dragover", event => {
          if (!dragged) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
        });
        row.addEventListener("drop", event => {
          if (!dragged) return;
          event.preventDefault();
          move(dragged, row);
          dragged.firstElementChild.focus();
          dragged = null;
        });
        row.addEventListener("dragend", () => { dragged = null; });
        row.append(chip);
        list.append(row);
      }
      return list;
    }

    function selectedQuizAnswers() {
      return [...quizChoices.querySelectorAll("fieldset")].map(group => {
        const ordered = group.querySelector(".order-parts");
        if (ordered) return [...ordered.children].map(row => Number(row.dataset.part));
        const typed = group.querySelector("input[data-typed-answer]");
        if (typed) return typed.value.trim() ? typed.value : null;
        const answer = group.querySelector("input:checked");
        return answer ? Number(answer.value) : null;
      });
    }
    const writingInput = document.getElementById("writingInput");
    const quizChoices = document.getElementById("quizChoices");
    const writingDrafts = new Map();
    const submittedTasks = new Set();

    function syncWriting(task, assignedPageTask = false) {
      const nextId = task?.task_id || null;
      if (nextId !== writingTaskId) {
        if (writingTaskId) {
          writingDrafts.set(writingTaskId, isQuiz ? selectedQuizAnswers() : writingForm.elements.response.value);
        }
        writingTaskId = nextId;
        const materials = document.getElementById("writingMaterials");
        materials.replaceChildren();
        window.renderTaskMaterials(materials, task?.materials);
        const draft = writingDrafts.get(nextId) || "";
        isQuiz = ["multiple_choice", "cloze", "short_answer", "ordering_sentence", "ordering_paragraph"].includes(task?.type);
        isSpeaking = task?.type === "speaking";
        document.getElementById("taskHeading").textContent = ({speaking: "Speaking", multiple_choice: "Multiple choice", cloze: "Cloze", short_answer: "Short answer", ordering_sentence: "Ordering sentence", ordering_paragraph: "Ordering paragraph"})[task?.type] || "Writing";
        writingInput.hidden = isQuiz;
        writingForm.elements.response.required = !isQuiz;
        quizChoices.hidden = !isQuiz;
        quizChoices.querySelector("legend").textContent = task?.type === "multiple_choice" ? "Choose one answer" : task?.type?.startsWith("ordering_") ? "Drag the cards or tap two to swap them" : "Enter your answers";
        quizChoices.querySelectorAll("fieldset").forEach(group => group.remove());
        if (isQuiz) {
          task.questions.forEach((question, questionIndex) => {
            const group = document.createElement("fieldset");
            const legend = document.createElement("legend");
            legend.textContent = `${questionIndex + 1}. ${question.prompt}`;
            group.append(legend);
            window.renderTaskMaterials(group, question.materials);
            if (question.parts) {
              group.append(renderOrderingParts(question.parts, draft[questionIndex], task.type === "ordering_sentence"));
              quizChoices.append(group);
              return;
            }
            if (task.type !== "multiple_choice") {
              const label = document.createElement("label");
              const answer = document.createElement("input");
              answer.type = "text";
              answer.dataset.typedAnswer = "";
              answer.required = true;
              answer.maxLength = 500;
              answer.value = draft[questionIndex] || "";
              label.append("Answer ", answer);
              group.append(label);
              quizChoices.append(group);
              return;
            }
            for (const index of optionOrder(task, question, questionIndex)) {
              const label = document.createElement("label");
              label.style.display = "block";
              const radio = document.createElement("input");
              radio.type = "radio";
              radio.name = "quizAnswer-" + questionIndex;
              radio.value = String(index);
              radio.required = true;
              radio.checked = draft[questionIndex] === index;
              label.append(radio, " " + question.options[index]);
              group.append(label);
            }
            quizChoices.append(group);
          });
        } else {
          writingForm.elements.response.value = draft;
        }
        writingStatus.textContent = submittedTasks.has(nextId) ? "Response submitted." : "";
      }
      writingPanel.toggleAttribute("data-speaking", isSpeaking);
      const hideTask = !nextId || (!assignedPageTask && displayMode !== "interact") || !studentId;
      if (writingPanel.hidden !== hideTask) {
        if (hideTask) writingPanel.querySelectorAll(".task-materials audio, .task-materials video").forEach(media => media.pause());
        writingPanel.querySelectorAll(".task-materials iframe").forEach(frame => {
          if (hideTask) { frame.dataset.mediaSrc = frame.src; frame.src = "about:blank"; }
          else if (frame.dataset.mediaSrc) { frame.src = frame.dataset.mediaSrc; delete frame.dataset.mediaSrc; }
        });
      }
      writingPanel.hidden = hideTask;
      if (task) document.getElementById("writingPrompt").textContent = task.prompt;
      writingForm.hidden = isSpeaking || submittedTasks.has(nextId);
      speakingPanel.hidden = !isSpeaking || submittedTasks.has(nextId);
      if (writingPanel.hidden || recordingTaskId !== nextId) stopRecording();
      if (writingPanel.hidden) audioPreview.pause();
      updateAudioControls();
    }

    writingForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const answers = isQuiz ? selectedQuizAnswers() : [];
      if (answers.some(answer => answer === null)) return;
      const responseText = isQuiz
        ? JSON.stringify(answers.length === 1 && typeof answers[0] === "number" ? answers[0] : answers)
        : writingForm.elements.response.value;
      const taskId = writingTaskId;
      if (writingPanel.hidden || !taskId || submittedTasks.has(taskId) || !responseText.trim()) return;
      const button = writingForm.querySelector("button");
      button.disabled = true;
      writingForm.elements.response.readOnly = true;
      try {
        const response = await fetch(`${API_BASE}/sessions/${sessionPin}/tasks/${taskId}/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ student_id: studentId, response: responseText })
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(typeof result.detail === "string" ? result.detail : "Could not submit your response.");
        }
        submittedTasks.add(taskId);
        if (taskId === writingTaskId) {
          writingForm.hidden = true;
          writingStatus.textContent = "Response submitted.";
        }
      } catch (error) {
        if (taskId === writingTaskId) writingStatus.textContent = error.message + " Your response is still available.";
      } finally {
        button.disabled = false;
        writingForm.elements.response.readOnly = false;
      }
    });
    let pollInFlight = false;
    const focusMessage = document.getElementById("focusMessage");
    let isDisconnected = false;
    let pollingTimer = null;

    async function loadStudentBlock(targetIndex = blockIndex) {
      try {
        const res = await fetch(lessonUrl);

        if (!res.ok) {
          throw new Error("Cannot load lesson JSON: " + lessonUrl);
        }

        const lesson = await res.json();
        currentLesson = lesson;
        
        const blocks = lesson.blocks || [];
        const block = blocks[targetIndex];

        if (!block) {
          throw new Error("Block not found at index: " + blockIndex);
        }

        if (block.type !== "activity") {
          throw new Error("Unsupported block type: " + block.type);
        }

        blockIndex = targetIndex;

        lessonTitle.textContent = lesson.title || lesson.lesson_id || "Lesson";
        blockTitle.textContent =
          `${blockIndex + 1}/${blocks.length} · ${block.title || block.id}`;
        statusText.textContent = block.activity_kind || block.type;

        playerFrame.src = window.runtimePlayerUrl(block, "student");


        prevBtn.disabled = blockIndex <= 0;
        nextBtn.disabled = blockIndex >= blocks.length - 1;
        
      } catch (err) {
        console.error(err);
        playerFrame.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = err.message;
        lessonTitle.textContent = "Failed to load";
        blockTitle.textContent = "";
      }
    }

    function updateUrlBlockParam(index) {
      const url = new URL(window.location.href);
      url.searchParams.set("block", index);
      window.history.replaceState({}, "", url.toString());
    }

    function goToBlock(index) {
      if (!currentLesson) return;

      const blocks = currentLesson.blocks || [];

      if (index < 0 || index >= blocks.length) {
        return;
      }

      updateUrlBlockParam(index);
      loadStudentBlock(index);
    }

    async function loadSessionFromPin() {
      if (!sessionPin) {
        loadStudentBlock();
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/sessions/${sessionPin}/state${studentId ? "?student_id=" + encodeURIComponent(studentId) : ""}`);

        if (!res.ok) {
          throw new Error("Session not found: " + sessionPin);
        }

        const session = await res.json();

        if (!session.lesson_path) {
          throw new Error("Session has no lesson_path");
        }

        const sessionLessonUrl = window.runtimeLessonUrl(session.lesson_path);
        const lessonRes = await fetch(sessionLessonUrl);

        if (!lessonRes.ok) {
          throw new Error("Cannot load lesson JSON: " + sessionLessonUrl);
        }

        currentLesson = await lessonRes.json();
        blockIndex = session.current_block_index || 0;
        lastSessionBlockIndex = blockIndex;
        displayMode = session.display_mode || "follow";
        slideStep = session.slide_step || 0;
        syncBlockTask(session);

        renderSessionBlock();
        startSessionPolling();
      } catch (err) {
        showStudentError(err);
      }
    }

    function renderSessionBlock() {
      if (!currentLesson) return;

      const blocks = currentLesson.blocks || [];
      const block = blocks[blockIndex];

      if (!block) {
        showStudentError(new Error("Block not found at index: " + blockIndex));
        return;
      }

      lessonTitle.textContent =
        currentLesson.title || currentLesson.lesson_id || "Lesson";

      blockTitle.textContent =
        `${blockIndex + 1}/${blocks.length} · ${block.title || block.id}`;

      statusText.textContent = sessionPin
        ? `PIN ${sessionPin}`
        : (block.activity_kind || block.type);

      const focus = displayMode === "focus";
      const interact = displayMode === "interact";
      focusMessage.hidden = !focus;
      playerFrame.style.display = focus ? "none" : "block";
      playerFrame.inert = !interact;
      if (!interact) playerFrame.blur();
      const source = focus || block.task ? "about:blank" : window.runtimePlayerUrl(block, "student");
      if (playerFrame.src !== source) playerFrame.src = source;
      showSlideStep();
      statusText.textContent = `PIN ${sessionPin} · ${displayMode}`;

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      completeBtn.disabled = !interact || !studentId || Boolean(block.task) || block.activity_kind === "google-slide";
      completeBtn.textContent = "Complete";
    }

    function startSessionPolling() {
      if (pollingTimer) clearInterval(pollingTimer);

      pollingTimer = setInterval(async () => {
        if (pollInFlight) return;
        pollInFlight = true;
        try {
          const res = await fetch(`${API_BASE}/sessions/${sessionPin}/state${studentId ? "?student_id=" + encodeURIComponent(studentId) : ""}`);
          if (!res.ok) {
            throw new Error("Polling failed: " + res.status);
          }

          const session = await res.json();

          if (isDisconnected) {
            statusText.textContent = `PIN ${sessionPin}`;
            isDisconnected = false;
          }

          if (
            session.status === "ended" ||
            session.status === "expired"
          ) {
            lessonTitle.textContent = "Session ended";
            blockTitle.textContent =
              session.status === "expired"
                ? "This PIN has expired."
                : "Please wait for your teacher.";
            statusText.textContent = `PIN ${sessionPin}`;
            playerFrame.style.display = "none";
            playerFrame.src = "about:blank";
            focusMessage.hidden = true;
            writingPanel.hidden = true;
            pageTaskPicker.hidden = true;
            renderDialogueCard(null);
            pageTaskState = null;
            void syncScores(null);
            stopRecording();
            audioPreview.pause();
            completeBtn.disabled = true;
            errorBox.style.display = "block";
            errorBox.textContent =
              session.status === "expired"
                ? "The class session has expired."
                : "The class session has ended.";
            if (pollingTimer) {
              clearInterval(pollingTimer);
              pollingTimer = null;
            }
            return;
          }
          
          const nextIndex = session.current_block_index || 0;

          const nextMode = session.display_mode || "follow";
          slideStep = session.slide_step || 0;
          if (nextIndex !== lastSessionBlockIndex || nextMode !== displayMode) {
            displayMode = nextMode;
            blockIndex = nextIndex;
            lastSessionBlockIndex = nextIndex;
            renderSessionBlock();
          }
          showSlideStep();
          syncBlockTask(session);
        } catch (err) {
          console.error(err);
          if (!isDisconnected) {
            statusText.textContent = "Reconnecting...";
            isDisconnected = true;
          }
        } finally {
          pollInFlight = false;
        }
      }, 1000);
    }

    async function completeCurrentBlock() {
      if (!sessionPin || !studentId || !currentLesson) {
        return;
      }

      const blocks = currentLesson.blocks || [];
      const block = blocks[blockIndex];

      if (!block) {
        return;
      }

      try {
        completeBtn.disabled = true;
        completeBtn.textContent = "Completed";

        const res = await fetch(
          `${API_BASE}/sessions/${sessionPin}/events`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              student_id: studentId,
              block_index: blockIndex,
              block_id: block.id,
              event_type: "block_completed",
            }),
          }
        );

        if (!res.ok) {
          throw new Error("Could not complete block.");
        }
      } catch (err) {
        console.error(err);
        completeBtn.disabled = false;
        completeBtn.textContent = "Complete";
      }
    }

    function showStudentError(err) {
      console.error(err);
      playerFrame.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = err.message;
      lessonTitle.textContent = "Failed to load";
      blockTitle.textContent = "";
    }

    prevBtn.addEventListener("click", () => {
      if (sessionPin) return;
      goToBlock(blockIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      if (sessionPin) return;
      goToBlock(blockIndex + 1);
    });

    completeBtn.addEventListener("click", () => {
      completeCurrentBlock();
    });

    loadSessionFromPin();
  </script>
</body>
