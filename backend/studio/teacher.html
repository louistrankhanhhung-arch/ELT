<!DOCTYPE html>
<html lang="en" class="reh-classroom">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root English House</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #F7FAF3;
      color: #18352A;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #CCDCC8;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title p {
      margin: 4px 0 0;
      color: #456052;
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    button {
      padding: 8px 11px;
      border: 1px solid #CCDCC8;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .app {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid #CCDCC8;
      padding: 12px;
      overflow-y: auto;
    }

    .block-btn {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid #CCDCC8;
      border-radius: 10px;
      background: #F7FAF3;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .block-btn.active {
      border-color: #18352A;
      background: #E9F2E3;
      font-weight: bold;
    }

    .preview {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .current {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #CCDCC8;
      font-size: 14px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
      flex: 1;
      min-height: 0;
    }

    .error {
      padding: 20px;
      color: #b00020;
    }

    @media (max-width: 800px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        flex-wrap: wrap;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .sidebar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-bottom: 1px solid #CCDCC8;
        padding: 8px;
      }

      .block-btn {
        width: auto;
        min-width: 150px;
        margin-bottom: 0;
        white-space: nowrap;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      header {
        padding: 6px 8px;
        gap: 8px;
      }

      .title h1 {
        font-size: 15px;
      }

      .title p {
        display: none;
      }

      .controls {
        gap: 4px;
      }

      button {
        padding: 5px 8px;
        font-size: 12px;
      }

      .sidebar {
        padding: 6px;
        gap: 6px;
      }

      .block-btn {
        min-width: 120px;
        padding: 8px 10px;
        font-size: 13px;
      }

      .current {
        display: none;
      }

      iframe {
        min-height: 0;
      }
    }

    /* =========================
       PRESENTATION MODE
       ========================= */

    body.presentation-mode {
      background: #000;
    }

    body.presentation-mode header,
    body.presentation-mode .sidebar,
    body.presentation-mode .current,
    body.presentation-mode #sessionBanner,
    body.presentation-mode #monitorPanel {
      display: none !important;
    }

    body.presentation-mode .app {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    body.presentation-mode .preview {
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    body.presentation-mode #previewFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #fff;
    }

    .presentation-controls {
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.presentation-mode .presentation-controls {
      display: flex;
    }

    body.presentation-mode.show-presentation-controls
      .presentation-controls {
      opacity: 1;
    }

    .presentation-controls button {
      border: 0;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .presentation-counter {
      color: #fff;
      font-size: 13px;
      min-width: 64px;
      text-align: center;
    }

    /* =========================
       ANNOTATION
       ========================= */

    #annotationCanvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9000;
      pointer-events: none;
      touch-action: none;
    }

    body.presentation-mode #annotationCanvas {
      display: block;
    }

    body.annotation-drawing #annotationCanvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    .annotation-btn.active {
      background: #286340;
      color: #fff;
    }

    #annotationColor {
      width: 32px;
      height: 32px;
      padding: 2px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    #writingPanel {
      box-sizing: border-box;
      margin: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #CCDCC8;
      border-radius: 10px;
      color: #18352A;
      overflow: auto;
      max-height: 40vh;
      flex-shrink: 0;
    }
    #writingPanel > summary { cursor: pointer; font-weight: 650; }
    #writingPanel h2 { margin: 0 0 8px; font-size: 1.1rem; }
    #writingPanel form { margin: 10px 0; }
    #writingPanel textarea {
      box-sizing: border-box;
      display: block;
      width: min(100%, 48rem);
      margin: 6px 0 10px;
      padding: 9px 10px;
      border: 1px solid #A5BDA0;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
    }
    #writingPanel button {
      background: #286340;
      border: 0;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    #writingPanel button:disabled { opacity: .55; cursor: default; }
    #writingPanel p { margin: 8px 0; }
    #writingPanel p:empty { display: none; }
    #writingResults details { border-top: 1px solid #CCDCC8; padding: 8px 0; }
    #writingResults summary { cursor: pointer; }
    .live-submission-status { list-style: none; padding: 0; font-size: .88rem; }
    .live-submission-status li { padding: 4px 0; }
    .live-submission-status li[data-submitted="true"] { color: #286340; }
    body.presentation-mode #writingPanel { display: none; }
  </style>

  <script>
    const BASE_URL =
      window.ELT_CONFIG?.BASE_URL ||
      "https://rootenglishhouse.com/";

    const API_BASE =
      window.ELT_CONFIG?.API_BASE ||
      "https://elt-production.up.railway.app/api";

    console.log("ELT_CONFIG", window.ELT_CONFIG);
    console.log("API_BASE", API_BASE);
    console.log("BASE_URL", BASE_URL);

    const params = new URLSearchParams(window.location.search);

    const lessonPath =
      params.get("lesson") ||
      "lessons/g1rec/l02/g1rec-l02.json";

    let blockIndex = Number(params.get("block") || 0);

    const teacherTokenInput = document.createElement("input");
    teacherTokenInput.type = "password";
    teacherTokenInput.placeholder = "Staging teacher access code";
    teacherTokenInput.setAttribute("aria-label", "Staging teacher access code");
    teacherTokenInput.autocomplete = "off";
    teacherTokenInput.dataset.targetCatalogCode = "";
    document.getElementById("sessionAccess").append(teacherTokenInput);
    const sessionClassCode = document.getElementById("sessionClassCode");
    teacherTokenInput.addEventListener("change", async () => {
      const code = teacherTokenInput.value.trim();
      const options = document.getElementById("sessionClassCodes");
      options.replaceChildren();
      if (!code) return;
      try {
        const response = await fetch(API_BASE + "/learner-classes", {
          headers: {Authorization: "Bearer " + code}, cache: "no-store"
        });
        if (!response.ok || code !== teacherTokenInput.value.trim()) return;
        const result = await response.json();
        if (code === teacherTokenInput.value.trim()) options.replaceChildren(...result.classes.map(item =>
          new Option(item.course + " " + item.level, item.class_code)));
      } catch (error) { console.error("Could not load class codes", error); }
    });
    let teacherToken = "";
    function teacherHeaders() {
      return teacherToken ? { Authorization: "Bearer " + teacherToken } : {};
    }

    const teacherNotes = document.getElementById("teacherNotes");
    const teacherNotesText = document.getElementById("teacherNotesText");
    let notesByBlock = null;
    let notesCode = null;
    let notesTimer;

    function renderTeacherNotes() {
      if (teacherNotes.hidden) return;
      const block = currentLesson?.blocks[blockIndex];
      teacherNotesText.textContent = notesByBlock
        ? notesByBlock.get(block?.id) || "No notes for this block."
        : "Enter the teacher access code in Live Session to view notes.";
    }

    async function loadTeacherNotes() {
      if (teacherNotes.hidden) return;
      const code = teacherTokenInput.value.trim();
      if (notesByBlock && notesCode === code) return;
      notesByBlock = null;
      notesCode = code;
      renderTeacherNotes();
      try {
        const response = await fetch(`${API_BASE}/work-lessons/${lessonPath.split("/")[1]}`, {
          headers: code ? { Authorization: "Bearer " + code } : {},
          cache: "no-store"
        });
        if (notesCode !== code || teacherTokenInput.value.trim() !== code) return;
        if (!response.ok) {
          if (code) teacherNotesText.textContent = "Could not load teacher notes. Check the access code.";
          return;
        }
        const { lesson } = await response.json();
        if (notesCode !== code || teacherTokenInput.value.trim() !== code) return;
        notesByBlock = new Map(lesson.blocks.map(block => [block.id, block.notes?.trim()]));
        renderTeacherNotes();
      } catch {
        if (notesCode === code && teacherTokenInput.value.trim() === code) {
          teacherNotesText.textContent = "Could not load teacher notes. Try entering the access code again.";
        }
      }
    }

    teacherTokenInput.addEventListener("input", () => {
      clearTimeout(notesTimer);
      notesByBlock = null;
      notesCode = null;
      renderTeacherNotes();
      notesTimer = setTimeout(loadTeacherNotes, 400);
    });

    const lessonUrl = window.runtimeLessonUrl(lessonPath);

    const lessonTitle = document.getElementById("lessonTitle");
    const lessonMeta = document.getElementById("lessonMeta");
    const blockList = document.getElementById("blockList");
    const currentBlock = document.getElementById("currentBlock");
    const previewFrame = document.getElementById("previewFrame");
    const errorBox = document.getElementById("errorBox");
    const startSessionBtn = document.getElementById("startSessionBtn");
    const endSessionBtn = document.getElementById("endSessionBtn");
    const sessionBanner = document.getElementById("sessionBanner");
    const monitorPanel = document.getElementById("monitorPanel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const homeBtn = document.getElementById("homeBtn");
    const copyStudentBtn = document.getElementById("copyStudentBtn");

    const presentationBtn =
      document.getElementById("presentationBtn");

    const presentationPrevBtn =
      document.getElementById("presentationPrevBtn");

    const presentationNextBtn =
      document.getElementById("presentationNextBtn");

    const exitPresentationBtn =
      document.getElementById("exitPresentationBtn");

    const presentationCounter =
      document.getElementById("presentationCounter");

    const annotationCanvas =
      document.getElementById("annotationCanvas");

    const annotationPointerBtn =
      document.getElementById("annotationPointerBtn");

    const annotationPenBtn =
      document.getElementById("annotationPenBtn");

    const annotationEraserBtn =
      document.getElementById("annotationEraserBtn");

    const annotationClearBtn =
      document.getElementById("annotationClearBtn");

    const annotationColor =
      document.getElementById("annotationColor");

    let currentLesson = null;
    let sessionPin = null;
    let slideStep = 0;
    let revealPending = false;
    const previousReveal = document.getElementById("previousReveal");
    const nextReveal = document.getElementById("nextReveal");
    const revealStatus = document.getElementById("revealStatus");

    function revealSteps() {
      const elements = currentLesson?.blocks[blockIndex]?.elements || [];
      return [...new Set([0, ...elements.flatMap(element => [element.appear, element.disappear])
        .filter(step => Number.isInteger(step))])].sort((a, b) => a - b);
    }

    let projectionWindow;
    let projectionFrame;
    let projectionTask;
    let projectedSubmission;
    let projectedRecording;
    const stopShowingSubmission = document.getElementById("stopShowingSubmission");

    function clearProjectedSubmission() {
      projectedSubmission = null;
      if (projectedRecording) URL.revokeObjectURL(projectedRecording);
      projectedRecording = null;
      stopShowingSubmission.hidden = true;
    }

    stopShowingSubmission.addEventListener("click", () => {
      clearProjectedSubmission();
      syncProjection();
    });
    const taskStage = document.getElementById("taskStage");
    const taskContent = document.getElementById("taskContent");
    const assignOnStage = document.getElementById("assignOnStage");
    const reviewTask = document.getElementById("reviewTask");
    const taskStageStatus = document.getElementById("taskStageStatus");

    function syncProjection() {
      if (!projectionWindow || projectionWindow.closed) return;
      if (projectedSubmission) {
        projectionFrame.style.display = "none";
        projectionTask.hidden = false;
        if (projectionTask.firstChild !== projectedSubmission) projectionTask.replaceChildren(projectedSubmission);
        return;
      }
      projectionFrame.style.display = taskStage.hidden ? "block" : "none";
      projectionTask.hidden = taskStage.hidden;
      if (taskStage.hidden) {
        projectionTask.replaceChildren();
        if (projectionFrame.src !== previewFrame.src) projectionFrame.src = previewFrame.src;
      }
      else projectionTask.replaceChildren(taskContent.cloneNode(true));
    }

    function renderTaskPreview(block) {
      const task = block.task;
      taskStage.hidden = !task;
      taskContent.replaceChildren();
      taskStageStatus.textContent = "";
      reviewTask.setAttribute("aria-pressed", "false");
      reviewTask.textContent = "Show answer key";
      const assigned = sessionPin && [...latestTasks].reverse().find(item => item.block_id === block.id);
      const quiz = task?.quiz || block.quiz;
      const questions = assigned?.questions || task?.questions || quiz?.questions ||
        (Array.isArray(quiz?.options) ? [{ ...quiz, prompt: task.prompt }] : []);
      reviewTask.hidden = !questions.some(question => Number.isInteger(question.correct_option) || question.accepted_answers?.length || question.correct_order?.length);
      if (!task) return;
      const heading = document.createElement("h2");
      heading.textContent = block.title || "Prepared task";
      const prompt = document.createElement("p");
      prompt.textContent = task.prompt || "";
      taskContent.append(heading, prompt);
      window.renderTaskMaterials(taskContent, task.materials);
      if (!questions.length) return;
      const list = document.createElement("ol");
      for (const question of questions) {
        const item = document.createElement("li");
        const questionText = document.createElement("p");
        questionText.textContent = question.prompt;
        const sentence = task.type === "ordering_sentence";
        const paragraph = task.type === "ordering_paragraph";
        const options = document.createElement(sentence || paragraph ? "ul" : "ol");
        if (sentence || paragraph) options.className = sentence ? "sentence-preview" : "paragraph-preview";
        else options.type = "A";
        (question.options || question.parts)?.forEach((option, index) => {
          const row = document.createElement("li");
          row.textContent = option;
          if (index === question.correct_option) {
            const key = document.createElement("strong");
            key.dataset.answerKey = "";
            key.hidden = true;
            key.textContent = " · Correct answer";
            row.append(key);
          }
          options.append(row);
        });
        item.append(questionText);
        window.renderTaskMaterials(item, question.materials);
        if (options.childElementCount) item.append(options);
        if (question.accepted_answers?.length || question.correct_order?.length) {
          const key = document.createElement("strong");
          key.dataset.answerKey = "";
          key.hidden = true;
          key.textContent = question.correct_order
            ? "Correct order: " + question.correct_order.map(index => question.parts[index]).join(question.separator)
            : "Accepted answers: " + question.accepted_answers.join(" / ");
          item.append(key);
        }
        list.append(item);
      }

    reviewTask.addEventListener("click", () => {
      const shown = reviewTask.getAttribute("aria-pressed") === "true";
      reviewTask.setAttribute("aria-pressed", String(!shown));
      reviewTask.textContent = shown ? "Show answer key" : "Hide answer key";
      taskContent.querySelectorAll("[data-answer-key]").forEach(key => { key.hidden = shown; });
      if (projectionWindow && !projectionWindow.closed && !taskStage.hidden && !projectedSubmission) {
        projectionTask.replaceChildren(taskContent.cloneNode(true));
      }
    });

    function showReveal() {
      const steps = revealSteps();
      previousReveal.hidden = nextReveal.hidden = steps.length === 1;
      const index = steps.indexOf(slideStep);
      previousReveal.disabled = revealPending || index <= 0;
      nextReveal.disabled = revealPending || index >= steps.length - 1;
      revealStatus.textContent = steps.length > 1 ? "Reveal " + (index + 1) + "/" + steps.length : "";
      const message = { type: "reh-slide-step", block: currentLesson?.blocks[blockIndex]?.id,
        step: slideStep, interactive: true };
      previewFrame.contentWindow?.postMessage(message, location.origin);
      if (projectionWindow && !projectionWindow.closed) {
        projectionFrame?.contentWindow?.postMessage(message, location.origin);
      }
    }

    async function changeReveal(direction) {
      const steps = revealSteps();
      const step = steps[steps.indexOf(slideStep) + direction];
      if (step === undefined || revealPending) return;
      const pin = sessionPin;
      const block = blockIndex;
      revealPending = true;
      showReveal();
      let failed = false;
      try {
        if (pin && !endSessionBtn.disabled) {
          const response = await fetch(`${API_BASE}/sessions/${pin}/slide-step`, {
            method: "POST",
            headers: { ...teacherHeaders(), "Content-Type": "application/json" },
            body: JSON.stringify({ block_index: block, step })
          });
          if (!response.ok) throw new Error("Could not change reveal");
        }
        if (block === blockIndex && pin === sessionPin) slideStep = step;
      } catch {
        failed = true;
      } finally {
        revealPending = false;
        showReveal();
        if (failed) revealStatus.textContent = "Could not sync reveal. Try again.";
      }
    }
    previousReveal.onclick = () => changeReveal(-1);
    nextReveal.onclick = () => changeReveal(1);
    previewFrame.addEventListener("load", showReveal);
    window.addEventListener("message", event => {
      if (event.origin === location.origin && (event.source === previewFrame.contentWindow || event.source === projectionFrame?.contentWindow)
          && event.data?.type === "reh-slide-ready") showReveal();
    });

    function addQuestion() {
      if (quizQuestions.children.length >= 30) return;
      const row = document.createElement("fieldset");
      row.innerHTML = `
        <legend>Question</legend>
        <label>Question text <textarea data-question rows="2" maxlength="4000"></textarea></label>
        <label>Learning target override <input data-target list="learningTargets" maxlength="120"></label>
        <label>Options (2–8, one per line) <textarea data-options rows="4"></textarea></label>
        <label>Correct option <select data-correct>
          ${Array.from("ABCDEFGH", (letter, index) => '<option value="' + index + '">' + letter + '</option>').join("")}
        </select></label>
        <button type="button" data-remove>Remove question</button>`;
      row.querySelector("[data-remove]").addEventListener("click", () => {
        if (quizQuestions.children.length > 1) row.remove();
        updateQuestionNumbers();
      });
      quizQuestions.append(row);
      updateQuestionNumbers();
    }

    function updateQuestionNumbers() {
      [...quizQuestions.children].forEach((row, index) => {
        row.querySelector("legend").textContent = "Question " + (index + 1);
        row.querySelector("[data-remove]").disabled = quizQuestions.children.length === 1;
      });
      addQuizQuestion.disabled = quizQuestions.children.length >= 30;
    }

    function syncTaskType() {
      quizOptions.hidden = writingAssignForm.elements.taskType.value !== "multiple_choice";
      writingAssignForm.elements.prompt.required = quizOptions.hidden;
      if (!quizOptions.hidden && !quizQuestions.children.length) addQuestion();
    }
    addQuizQuestion.addEventListener("click", addQuestion);
    writingAssignForm.elements.taskType.addEventListener("change", syncTaskType);

    function taskPayload(prompt) {
      const context = { phase: writingAssignForm.elements.evidencePhase.value || null,
        learning_target_id: writingAssignForm.elements.learningTarget.value.trim() || null };
      if (writingAssignForm.elements.taskType.value !== "multiple_choice") {
        if (!prompt) throw new Error("Enter a task prompt.");
        return { ...context, prompt, speaking: writingAssignForm.elements.taskType.value === "speaking" };
      }
      const questions = [...quizQuestions.children].map((row, index) => {
        const question = row.querySelector("[data-question]").value.trim();
        const options = row.querySelector("[data-options]").value.trim().split(/\r?\n/).map(option => option.trim());
        const correct_option = Number(row.querySelector("[data-correct]").value);
        if (!question || options.length < 2 || options.length > 8 || options.some(option => !option)
            || new Set(options).size !== options.length || correct_option >= options.length) {
          throw new Error("Question " + (index + 1) + ": enter a question, 2–8 distinct options and a valid correct option.");
        }
        return { prompt: question, options, correct_option,
          learning_target_id: row.querySelector("[data-target]").value.trim() || null };
      });
      return { ...context, prompt: prompt || "Multiple-choice quiz", quiz: { questions, shuffle: writingAssignForm.elements.shuffle.checked } };
    }

    function syncWritingControls() {
      const live = Boolean(sessionPin) && !endSessionBtn.disabled;
      const prepared = currentLesson?.blocks[blockIndex]?.task;
      prepareWriting.hidden = live || currentLesson?.origin === "work";
      copyLessonLink.hidden = live;
      assignQuick.hidden = !live;
      assignOnStage.disabled = !live || !prepared;
      if (prepared && !live) taskStageStatus.textContent = "Start a session to assign this task.";
      else if (live && taskStageStatus.textContent === "Start a session to assign this task.") taskStageStatus.textContent = "";
      writingAssignForm.hidden = !live && currentLesson?.origin === "work";
      openQuick.hidden = writingAssignForm.hidden;
      openQuick.textContent = live ? "Quick assign" : "Prepare task";
      document.getElementById("quickTaskTitle").textContent = openQuick.textContent;
      if (openQuick.hidden && quickDialog.open) quickDialog.close();
    }

    async function writingRequest(path, payload) {
      const response = await fetch(API_BASE + path, {
        method: "POST",
        headers: { ...teacherHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : "Could not save the task.");
      return result;
    }

    prepareWriting.addEventListener("click", async () => {
      const prompt = writingAssignForm.elements.prompt.value.trim();
      if (!currentLesson || !lessonPath.startsWith("imports/")) {
        setWritingFeedback("Open an imported deck before saving a task block.");
        return;
      }
      teacherToken = teacherTokenInput.value.trim();
      prepareWriting.disabled = true;
      try {
        const result = await writingRequest("/" + lessonPath + "/writing-blocks", { ...taskPayload(prompt), after_block: blockIndex });
        const next = new URL(location.href);
        next.searchParams.set("lesson", result.lesson_path);
        next.searchParams.set("block", result.block_index);
        location.assign(next.href);
      } catch (error) {
        setWritingFeedback(error.message);
      } finally {
        prepareWriting.disabled = false;
      }
    });

    copyLessonLink.addEventListener("click", async () => {
      const link = new URL(location.href);
      link.searchParams.delete("block");
      try {
        await navigator.clipboard.writeText(link.href);
        setWritingFeedback("Lesson link copied.");
      } catch {
        setWritingFeedback("Copy the lesson URL from the address bar.");
      }

    async function assignWriting(payload, button) {
      if (!sessionPin) return;
      button.disabled = true;
      if (payload.block_id) assignOnStage.disabled = true;
      try {
        const pin = sessionPin;
        const result = await writingRequest(`/sessions/${pin}/tasks/writing`, payload);
        if (pin !== sessionPin || endSessionBtn.disabled) return;
        if (result.display_mode === "interact") {
          savedDisplayMode = displayMode.value = "interact";
          displayModeStatus.textContent = "";
        }
        setWritingFeedback("Assigned. Students can now submit in Interact mode.");
        if (payload.block_id === currentLesson.blocks[blockIndex]?.id) taskStageStatus.textContent = writingFeedback.textContent;
        if (button === assignQuick && quickDialog.open) quickDialog.close();
        if (payload.prompt) {
          writingAssignForm.reset();
          quizQuestions.replaceChildren();
          syncTaskType();
        }
        await updateWritingResults(sessionPin);
      } catch (error) {
        setWritingFeedback(error.message);
        if (payload.block_id === currentLesson.blocks[blockIndex]?.id) taskStageStatus.textContent = error.message;
      } finally {
        button.disabled = false;
        if (payload.block_id) {
          syncWritingControls();
        }
      }
    }

    writingAssignForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const prompt = writingAssignForm.elements.prompt.value.trim();
      if (!assignQuick.hidden) {
        try {
          assignWriting(taskPayload(prompt), assignQuick);
        } catch (error) {
          setWritingFeedback(error.message);
        }
      }
    });
    assignOnStage.addEventListener("click", () => {

    let latestTasks = [];
    async function updateWritingResults(pin) {
      const response = await fetch(`${API_BASE}/sessions/${pin}/tasks/results?include_roster=true`, { headers: teacherHeaders() });
      if (!response.ok || pin !== sessionPin) return;
      const result = await response.json();
      if (pin !== sessionPin) return;
      latestTasks = result.tasks;
      const block = currentLesson?.blocks[blockIndex];
      if (block?.task && reviewTask.hidden && latestTasks.some(task => task.block_id === block.id && task.questions?.length)) {
        const feedback = taskStageStatus.textContent;
        renderTaskPreview(block);
        taskStageStatus.textContent = feedback;
        syncProjection();
      }
      reportButton.hidden = !result.tasks.length;
      const summary = JSON.stringify([result.students, result.tasks.map(task =>
        [task.task_id, task.submissions.map(row => row.student_id), task.recipient_ids])]);
      if (summary === lastWritingSummary) return;
      lastWritingSummary = summary;
      const open = new Set([...writingResults.querySelectorAll("details[open]")].map(row => row.id));
      writingCount.textContent = `(${result.tasks.length})`;
      writingResults.replaceChildren(...result.tasks.map((task, index) => {
        const group = document.createElement("details");
        group.id = task.task_id;
        group.open = open.has(group.id);
        const label = document.createElement("summary");
        const recipients = task.recipient_ids ? result.students.filter(student => task.recipient_ids.includes(student.student_id)) : result.students;
        const submitted = new Set(task.submissions.map(row => row.student_id));
        label.textContent = `${window.classroomReportTitle(task, index)} · ${submitted.size}/${recipients.length} submitted`;
        const list = document.createElement("ul");
        list.className = "live-submission-status";
        for (const student of recipients) {
          const row = document.createElement("li");
          const done = submitted.has(student.student_id);
          row.textContent = student.student_name + (done ? " · Submitted" : " · Awaiting submission");
          row.dataset.submitted = String(done);
          list.append(row);
        }
        group.append(label, list);
        return group;
      }));
    }

    async function loadLesson() {
      try {
        const res = await fetch(lessonUrl);

          throw new Error("Cannot load lesson JSON: " + lessonUrl);

        currentLesson = await res.json();
        teacherNotes.hidden = currentLesson.origin !== "work" || !/^imports\/[a-f0-9]{32}$/.test(lessonPath);

    function renderBlockList(blocks) {
      blockList.innerHTML = "";

      blocks.forEach((block, index) => {
        const btn = document.createElement("button");
        btn.className = "block-btn";
        btn.dataset.index = index;
        btn.textContent = `${index + 1}. ${(block.phase ? block.phase.toUpperCase() + " · " : "") + (block.title || block.id)}`;
        btn.onclick = () => {
          goToBlock(index);
          syncSessionSetBlock(index);
        };

        blockList.appendChild(btn);
      });
    }

    function goToBlock(index, updateUrl = true) {
      if (!currentLesson) return;

      const blocks = currentLesson.blocks || [];

      if (index < 0 || index >= blocks.length) return;

      const block = blocks[index];

      if (block.type !== "activity") {
        showError("Unsupported block type: " + block.type);
        return;
      }

      clearProjectedSubmission();
      blockIndex = index;
      pageFeedback.textContent = "";
      pageAudience = [];
      dialogueGroups = [];
      dialogueFeedback.textContent = "";
      renderDialogueControls();
      renderPageControls();
      if (!pageControls.hidden) pageControls.open = true;
      renderTeacherNotes();
      slideStep = 0;
      showReveal();

      document.querySelectorAll(".block-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === blockIndex);
      });

      currentBlock.textContent =
        `Current block: ${blockIndex + 1}/${blocks.length} · ${block.title || block.id} · ${block.activity_kind || block.type}`;

      previewFrame.src = block.task ? "about:blank" : window.runtimePlayerUrl(block, "teacher");
      renderTaskPreview(block);
      syncProjection();
      syncWritingControls();
      previewFrame.style.display = block.task ? "none" : "block";
      errorBox.style.display = "none";

      prevBtn.disabled = blockIndex <= 0;
      nextBtn.disabled = blockIndex >= blocks.length - 1;

      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("lesson", lessonPath);
        url.searchParams.set("block", blockIndex);
        window.history.replaceState({}, "", url.toString());
      }
      
      if (presentationCounter) {
        presentationCounter.textContent =
          `${blockIndex + 1} / ${blocks.length}`;
      }

      clearAnnotations();
    }

      try {
        startSessionBtn.disabled = true;

        const res = await fetch(`${API_BASE}/sessions/start`, {
          method: "POST",

            ...teacherHeaders(),
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            class_code: sessionClassCode.value.trim() || null,
            lesson_id: currentLesson.lesson_id,
            lesson_path: lessonPath,
            total_blocks: currentLesson.blocks.length,
            current_block_index: blockIndex,
          }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Failed to start session: ${res.status} ${text}`);

        latestTasks = [];
        renderTaskPreview(currentLesson.blocks[blockIndex]);

    function renderDialogueControls() {
      const show = Boolean(sessionPin && !endSessionBtn.disabled && currentLesson?.blocks[blockIndex]?.dialogue);
      if (show && dialogueControls.hidden) dialogueControls.open = true;
      dialogueControls.hidden = !show;
      if (!show) return;
      pairDialogue.disabled = dialogueBusy || pageRoster.length < 2 || dialogueGroups.length === pageRoster.length;
      pairDialogue.textContent = dialogueGroups.length ? "Re-pair including new students" : "Pair students";
      swapDialogue.disabled = dialogueBusy || !dialogueGroups.length;
      const groups = new Map();
      for (const entry of dialogueGroups) {
        if (!groups.has(entry.group_number)) groups.set(entry.group_number, []);
        groups.get(entry.group_number).push(entry.student_name + " · " + entry.role);
      }
      document.getElementById("dialogueGroups").replaceChildren(...[...groups].map(([number, names]) => {
        const row = document.createElement("li");
        row.textContent = "Group " + number + ": " + names.join(" / ");
        return row;
      }));
    }

    async function changeDialogue(action) {
      const pin = sessionPin;
      const block = currentLesson?.blocks[blockIndex];
      if (!pin || !block?.dialogue || dialogueBusy) return;
      if (action === "pair" && dialogueGroups.length && !confirm("Re-pair all students for this activity?")) return;
      dialogueBusy = true;
      renderDialogueControls();
      try {
        await writingRequest(`/sessions/${pin}/dialogue`, { block_id: block.id, action });
        if (pin === sessionPin && currentLesson.blocks[blockIndex]?.id === block.id) {
          dialogueFeedback.textContent = action === "swap" ? "Roles swapped." : "Role cards sent.";
          await updateMonitor();
        }
      } catch (error) {
        dialogueFeedback.textContent = error.message;
      } finally {
        dialogueBusy = false;
        renderDialogueControls();
      }
    }

    pairDialogue.addEventListener("click", () => void changeDialogue("pair"));
    swapDialogue.addEventListener("click", () => void changeDialogue("swap"));

    const pageControls = document.getElementById("pageControls");
    const pageStudents = document.getElementById("pageStudents");
    const pageFeedback = document.getElementById("pageFeedback");
    let pageRoster = [];
    let pageAudience = [];
    let pageBusy = false;

    function renderPageControls() {
      const tasks = currentLesson?.blocks[blockIndex]?.page_tasks;
      pageControls.hidden = !sessionPin || endSessionBtn.disabled || !tasks?.length;
      if (pageControls.hidden) return;
      const selected = new Set([...pageStudents.querySelectorAll("input:checked")].map(input => input.value));
      const signature = JSON.stringify([sessionPin, pageRoster.map(student => [student.student_id, student.student_name, student.labels])]);
      if (pageStudents.dataset.signature !== signature) {
        pageStudents.dataset.signature = signature;
        pageStudents.replaceChildren(...pageRoster.map(student => {
          const label = document.createElement("label");
          label.style.display = "block";
          const check = document.createElement("input");
          check.type = "checkbox";
          check.value = student.student_id;
          check.checked = selected.has(check.value);
          const labels = student.labels || [];
          label.append(check, " " + student.student_name + (labels.length ? " · " + labels.join(", ") : ""));
          return label;
        }));
      }
      document.getElementById("pageLabels").replaceChildren(...[...new Set(pageAudience.map(task => task.audience_label).filter(Boolean))]
        .map(label => new Option(label)));
      document.getElementById("pageAudience").replaceChildren(...pageAudience.map(task => {
        const count = pageRoster.filter(student => !task.audience_label || student.labels?.includes(task.audience_label)).length;
        const row = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = task.title;
        const audience = document.createElement("small");
        audience.textContent = (task.audience_label || "Everyone") + " · " + count + " recipient(s)";
        row.append(title, audience);
        return row;
      }));
      document.getElementById("assignPage").disabled = pageBusy || !pageRoster.length || !pageAudience.length;
    }

    async function runPageAction(path, payload, describe) {
      if (pageBusy || !sessionPin || endSessionBtn.disabled) return;
      pageBusy = true;
      renderPageControls();
      const pin = sessionPin;
      try {
        const result = await writingRequest(`/sessions/${pin}/${path}`, payload);
        if (pin !== sessionPin) return;
        pageFeedback.textContent = describe(result);
        await updateMonitor();
      } catch (error) {
        pageFeedback.textContent = error.message;
      } finally {
        pageBusy = false;
        renderPageControls();
      }
    }

    document.getElementById("labelForm").addEventListener("submit", event => {
      event.preventDefault();
      const student_ids = [...pageStudents.querySelectorAll("input:checked")].map(input => input.value);
      if (!student_ids.length) { pageFeedback.textContent = "Select at least one student."; return; }
      const remove = event.submitter?.value === "remove";
      void runPageAction("page-labels", { student_ids, label: document.getElementById("pageLabel").value, remove },
        () => remove ? "Label removed." : "Label added.");
    });
    document.getElementById("assignPage").addEventListener("click", () => {
      const block_id = currentLesson.blocks[blockIndex].id;
      void runPageAction("assign-page", { block_id },
        result => {
          const added = result.tasks.reduce((total, task) => total + task.added, 0);
          return added ? "Page assigned · " + added + " new task delivery(s)." : "No new recipients.";
        });
    });

    async function updateMonitor() {
      const pin = sessionPin;
      if (!pin) return;

      try {
        const res = await fetch(`${API_BASE}/sessions/${pin}/state`, { headers: teacherHeaders() });
        if (!res.ok || pin !== sessionPin) return;
        const session = await res.json();
        if (session.active_writing_task || currentLesson?.blocks[blockIndex]?.page_tasks?.length) await updateWritingResults(pin);
        if (pin !== sessionPin || endSessionBtn.disabled) return;

        const students = session.students || [];
        document.getElementById("studentCount").textContent = `(${students.length})`;
        pageRoster = students;
        dialogueGroups = session.current_block_index === blockIndex ? session.dialogue_groups || [] : [];
        renderDialogueControls();
        pageAudience = session.current_block_index === blockIndex ? session.page_audience || [] : [];
        renderPageControls();
        const completed = new Set((session.events || [])
          .filter(event => event.event_type === "block_completed" && event.block_index === blockIndex)
          .map(event => event.student_id));
        const task = latestTasks.find(item => item.task_id === session.active_writing_task?.task_id);
        const submissions = new Map((task?.submissions || []).map(item => [item.student_id, item]));
        const total = document.createElement("p");
        total.textContent = task
          ? `Joined: ${students.length} · Submitted: ${submissions.size}/${students.length}`
          : `Joined: ${students.length} · Block complete: ${completed.size}/${students.length}`;
        const list = document.createElement("ul");
        for (const student of students) {
          const row = document.createElement("li");
          const name = document.createElement("strong");
          name.textContent = student.learner_id || student.student_name || "Student";
          const status = document.createElement("span");
          const submitted = submissions.has(student.student_id);
          status.textContent = task ? (submitted ? "Submitted" : "Awaiting submission")
            : (completed.has(student.student_id) ? "Block complete" : "Joined");
          row.append(name, status);
          list.append(row);
        }
        const signature = JSON.stringify([pin, task?.task_id, total.textContent, list.textContent]);
        if (monitorPanel.dataset.signature !== signature) {
          monitorPanel.dataset.signature = signature;
          monitorPanel.replaceChildren(total, list);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function showError(message) {
      console.error(message);
      previewFrame.style.display = "none";
      taskStage.hidden = true;
      errorBox.style.display = "block";
      errorBox.textContent = message;
      currentBlock.textContent = "Current block: error";
    }

    function showPresentationControls() {
      if (!isPresentationMode) return;

      document.body.classList.add(
        "show-presentation-controls"
      );

      clearTimeout(presentationControlsTimer);

      presentationControlsTimer = setTimeout(() => {
        document.body.classList.remove(
          "show-presentation-controls"
        );
      }, 1800);
    }

    /* =========================
       ANNOTATION FUNCTIONS
       ========================= */

    function resizeAnnotationCanvas() {
      if (!annotationCanvas) return;

      const dpr = window.devicePixelRatio || 1;

      annotationCanvas.width =
        Math.round(window.innerWidth * dpr);

      annotationCanvas.height =
        Math.round(window.innerHeight * dpr);

      annotationCanvas.style.width =
        `${window.innerWidth}px`;

      annotationCanvas.style.height =
        `${window.innerHeight}px`;

      annotationCtx =
        annotationCanvas.getContext("2d");

      annotationCtx.setTransform(
        dpr, 0, 0, dpr, 0, 0
      );

      annotationCtx.lineCap = "round";
      annotationCtx.lineJoin = "round";
    }

    function clearAnnotations() {
      if (!annotationCanvas) return;

      const ctx =
        annotationCanvas.getContext("2d");

      ctx.clearRect(
        0,
        0,
        annotationCanvas.width,
        annotationCanvas.height
      );
    }

    function setAnnotationMode(mode) {
      annotationMode = mode;

      annotationPointerBtn.classList.toggle(
        "active",
        mode === "pointer"
      );

      annotationPenBtn.classList.toggle(
        "active",
        mode === "pen"
      );

      annotationEraserBtn.classList.toggle(
        "active",
        mode === "eraser"
      );

      document.body.classList.toggle(
        "annotation-drawing",
        mode !== "pointer"
      );

      showPresentationControls();
    }

    function getAnnotationPoint(event) {
      const rect =
        annotationCanvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function beginAnnotation(event) {
      if (
        annotationMode === "pointer" ||
        !isPresentationMode
      ) return;

      event.preventDefault();

      annotationDrawing = true;

      const point =
        getAnnotationPoint(event);

      annotationLastX = point.x;
      annotationLastY = point.y;

      annotationCanvas.setPointerCapture(
        event.pointerId
      );
    }

    function drawAnnotation(event) {
      if (
        !annotationDrawing ||
        annotationMode === "pointer"
      ) return;

      event.preventDefault();

      const point =
        getAnnotationPoint(event);

      if (!annotationCtx) {
        annotationCtx =
          annotationCanvas.getContext("2d");
      }

      annotationCtx.beginPath();
      annotationCtx.moveTo(
        annotationLastX,
        annotationLastY
      );
      annotationCtx.lineTo(
        point.x,
        point.y
      );

      if (annotationMode === "eraser") {
        annotationCtx.globalCompositeOperation =
          "destination-out";

        annotationCtx.lineWidth = 32;
      } else {
        annotationCtx.globalCompositeOperation =
          "source-over";

        annotationCtx.strokeStyle =
          annotationColor.value || "#e11d48";

        annotationCtx.lineWidth = 5;
      }

      annotationCtx.stroke();

      annotationLastX = point.x;
      annotationLastY = point.y;
    }

    function endAnnotation(event) {
      if (!annotationDrawing) return;

      annotationDrawing = false;

      try {
        annotationCanvas.releasePointerCapture(
          event.pointerId
        );
      } catch (_) {}
    }

    async function enterPresentationMode() {
      isPresentationMode = true;

      document.body.classList.add(
        "presentation-mode"
      );

      showPresentationControls();

      resizeAnnotationCanvas();
      setAnnotationMode("pointer");

      try {
        if (
          document.documentElement.requestFullscreen &&
          !document.fullscreenElement
        ) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.warn(
          "Browser fullscreen unavailable:",
          err
        );
      }
    }

    async function exitPresentationMode() {
      isPresentationMode = false;

      setAnnotationMode("pointer");

      document.body.classList.remove(
        "presentation-mode",
        "show-presentation-controls"
      );

      if (document.fullscreenElement) {
        try {
          await document.exitFullscreen();
        } catch (err) {
          console.warn(err);
        }
      }
    }

    function presentationNext() {
      if (!currentLesson) return;

      if (
        blockIndex <
        currentLesson.blocks.length - 1
      ) {
        goToBlock(blockIndex + 1);
        syncSessionSetBlock(blockIndex);
      }
    }

    function presentationPrevious() {
      if (!currentLesson) return;

      if (blockIndex > 0) {
        goToBlock(blockIndex - 1);
        syncSessionSetBlock(blockIndex);
      }
    }

    prevBtn.addEventListener("click", () => {
      goToBlock(blockIndex - 1);
      syncSessionSetBlock(blockIndex);
    });

    nextBtn.addEventListener("click", () => {
      goToBlock(blockIndex + 1);
      syncSessionSetBlock(blockIndex);
    });

    startSessionBtn.addEventListener("click", () => {
      startSession();
    });

    endSessionBtn.addEventListener("click", () => {
      endSession();
    });

    for (const id of ["editWorkLesson", "sessionResultsLink"]) {
      const action = document.getElementById(id);
      action.addEventListener("click", () => {
        window.location.assign(action.dataset.destination);
      });
    }

    copyStudentBtn.addEventListener("click", async () => {
      if (!sessionPin) {
        alert("Start a session before copying the join link.");
        return;
      }
      const studentUrl = buildStudentUrl();

      try {
        await navigator.clipboard.writeText(studentUrl);
        copyStudentBtn.textContent = "Copied!";
        setTimeout(() => {
          copyStudentBtn.textContent = "Copy Join Link";
        }, 1200);
      } catch (err) {
        alert(studentUrl);
      }
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "./teacher-home.html";
    });

    function openProjection() {
      if (!projectionWindow || projectionWindow.closed) {
        projectionWindow = window.open("about:blank", "_blank", "popup");
        if (!projectionWindow) {
          alert("Allow pop-ups for this site to open the presentation window.");
          return false;
        }
        const page = projectionWindow.document;
        page.title = "Classroom presentation";
        page.body.style.cssText = "margin:0;background:#0B3D25;height:100vh";
        projectionFrame = page.createElement("iframe");
        projectionFrame.title = "Lesson slide";
        projectionFrame.allow = "autoplay; fullscreen";
        projectionFrame.style.cssText = "display:block;width:100%;height:100%;border:0";
        projectionFrame.addEventListener("load", showReveal);
        projectionTask = page.createElement("main");
        projectionTask.style.cssText = "box-sizing:border-box;height:100%;overflow:auto;background:#F7FAF3;color:#18352A;padding:clamp(20px,5vw,72px);font:clamp(18px,2.4vw,36px) system-ui;white-space:pre-wrap";
        const materialsStyle = page.createElement("link");
        materialsStyle.rel = "stylesheet";
        materialsStyle.href = new URL("task-materials.css?v=reh-1", location.href).href;
        page.head.append(materialsStyle);
        page.body.append(projectionFrame, projectionTask);
        syncProjection();
      }
      projectionWindow.focus();
      return true;
    }

    presentationBtn.addEventListener("click", openProjection);

    async function showSubmission(pin, task, submission) {
      if (!openProjection()) return;
      clearProjectedSubmission();
      const page = projectionWindow.document;
      const card = page.createElement("article");
      card.style.cssText = "max-width:960px;margin:auto;overflow-wrap:anywhere";
      const addText = (parent, tag, value) => {
        const node = page.createElement(tag);
        node.textContent = value;
        parent.append(node);
        return node;
      };
      addText(card, "h1", "Sample response");
      addText(card, "p", task.prompt);
      projectedSubmission = card;
      stopShowingSubmission.hidden = false;
      if (task.type === "speaking") {
        const status = addText(card, "p", "Loading recording…");
        syncProjection();
        try {
          const response = await fetch(`${API_BASE}/sessions/${pin}/tasks/${task.task_id}/speaking/${submission.student_id}`, {
            headers: teacherHeaders()
          });
          if (!response.ok) throw new Error("Could not load the recording.");
          const recording = await response.blob();
          if (projectedSubmission !== card || projectionWindow.closed) return;
          projectedRecording = URL.createObjectURL(recording);
          const player = page.createElement("audio");
          player.controls = true;
          player.style.maxWidth = "100%";
          player.src = projectedRecording;
          status.replaceWith(player);
        } catch (error) {
          if (projectedSubmission === card) status.textContent = error.message;
        }
      } else if (task.questions?.length) {
        const list = page.createElement("ol");
        card.append(list);
        const selected = task.questions.length === 1 ? [submission.selected_option] : JSON.parse(submission.selected_option);
        task.questions.forEach((question, index) => {
          const row = page.createElement("li");
          addText(row, "strong", question.prompt);
          addText(row, "p", selected[index] ?? "");
          list.append(row);
        });
        syncProjection();
      } else {
        addText(card, "h2", "Student response");
        addText(card, "p", submission.response);
        syncProjection();
      }
    }

    window.addEventListener("pagehide", () => {
      clearProjectedSubmission();
      projectionWindow?.close();
      reportWindow?.close();
    });
    document.getElementById("expandSlide").addEventListener("click", event => {
      const expanded = document.body.classList.toggle("slide-expanded");
      event.currentTarget.setAttribute("aria-pressed", String(expanded));
      event.currentTarget.textContent = expanded ? "Restore layout" : "Expand slide";
    });

    exitPresentationBtn.addEventListener(
      "click",
      exitPresentationMode
    );

    presentationNextBtn.addEventListener(
      "click",
      presentationNext
    );

    presentationPrevBtn.addEventListener(
      "click",
      presentationPrevious
    );

    annotationPointerBtn.addEventListener(
      "click",
      () => setAnnotationMode("pointer")
    );

    annotationPenBtn.addEventListener(
      "click",
      () => setAnnotationMode("pen")
    );

    annotationEraserBtn.addEventListener(
      "click",
      () => setAnnotationMode("eraser")
    );

    annotationClearBtn.addEventListener(
      "click",
      clearAnnotations
    );

    annotationCanvas.addEventListener(
      "pointerdown",
      beginAnnotation
    );

    annotationCanvas.addEventListener(
      "pointermove",
      drawAnnotation
    );

    annotationCanvas.addEventListener(
      "pointerup",
      endAnnotation
    );

    annotationCanvas.addEventListener(
      "pointercancel",
      endAnnotation
    );

    window.addEventListener(
      "resize",
      () => {
        if (isPresentationMode) {
          resizeAnnotationCanvas();
        }
      }
    );

    document.addEventListener(
      "mousemove",
      () => {
        if (isPresentationMode) {
          showPresentationControls();
        }
      }
    );

    document.addEventListener(
      "fullscreenchange",
      () => {
        if (
          isPresentationMode &&
          !document.fullscreenElement
        ) {
          isPresentationMode = false;

          document.body.classList.remove(
            "presentation-mode",
            "show-presentation-controls"
          );
        }
      }
    );

    document.addEventListener("keydown", (e) => {
      if (
        e.target.tagName === "INPUT" ||
        e.target.tagName === "TEXTAREA" ||
        e.target.tagName === "SELECT"
      ) return;

      if (isPresentationMode) {
        if (e.key === "p" || e.key === "P") {
          e.preventDefault();
          setAnnotationMode("pen");
          return;
        }

        if (e.key === "v" || e.key === "V") {
          e.preventDefault();
          setAnnotationMode("pointer");
          return;
        }

        if (e.key === "e" || e.key === "E") {
          e.preventDefault();
          setAnnotationMode("eraser");
          return;
        }

        if (e.key === "c" || e.key === "C") {
          e.preventDefault();
          clearAnnotations();
          return;
        }
        
        if (e.key === "Escape") {
          e.preventDefault();
          
          if (annotationMode !== "pointer") {
            setAnnotationMode("pointer");
          } else {
            exitPresentationMode();
          }
          
          return;
        }

        if (
          e.key === "PageDown" ||
          e.key === "Enter"
        ) {
          e.preventDefault();
          presentationNext();
          return;
        }

        if (e.key === "PageUp") {
          e.preventDefault();
          presentationPrevious();
          return;
        }
      }
      
      // HOME
      if (e.key === "h" || e.key === "H") {
        window.location.href = "./teacher-home.html";
        return;
      }
    
      // NEXT
      if (
        e.key === " " ||
        e.key === "ArrowRight"
      ) {
        e.preventDefault();
    
        if (blockIndex < currentLesson.blocks.length - 1) {
          presentationNext();
        }
    
        return;
      }
    
      // PREVIOUS
      if (e.key === "ArrowLeft") {
        e.preventDefault();
    
        if (blockIndex > 0) {
          presentationPrevious();
        }
    
        return;
      }
    });

    loadLesson();
  </script>
</body>
