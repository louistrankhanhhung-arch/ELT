<!DOCTYPE html>
<html lang="en" class="reh-classroom">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root English House</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title p {
      margin: 4px 0 0;
      color: #666;
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    button {
      padding: 8px 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .app {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 12px;
      overflow-y: auto;
    }

    .block-btn {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .block-btn.active {
      border-color: #222;
      background: #eaeaea;
      font-weight: bold;
    }

    .preview {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .current {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
      flex: 1;
      min-height: 0;
    }

    .error {
      padding: 20px;
      color: #b00020;
    }

    @media (max-width: 800px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        flex-wrap: wrap;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .sidebar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-bottom: 1px solid #ddd;
        padding: 8px;
      }

      .block-btn {
        width: auto;
        min-width: 150px;
        margin-bottom: 0;
        white-space: nowrap;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      header {
        padding: 6px 8px;
        gap: 8px;
      }

      .title h1 {
        font-size: 15px;
      }

      .title p {
        display: none;
      }

      .controls {
        gap: 4px;
      }

      button {
        padding: 5px 8px;
        font-size: 12px;
      }

      .sidebar {
        padding: 6px;
        gap: 6px;
      }

      .block-btn {
        min-width: 120px;
        padding: 8px 10px;
        font-size: 13px;
      }

      .current {
        display: none;
      }

      iframe {
        min-height: 0;
      }
    }

    /* =========================
       PRESENTATION MODE
       ========================= */

    body.presentation-mode {
      background: #000;
    }

    body.presentation-mode header,
    body.presentation-mode .sidebar,
    body.presentation-mode .current,
    body.presentation-mode #sessionBanner,
    body.presentation-mode #monitorPanel {
      display: none !important;
    }

    body.presentation-mode .app {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    body.presentation-mode .preview {
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    body.presentation-mode #previewFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #fff;
    }

    .presentation-controls {
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.presentation-mode .presentation-controls {
      display: flex;
    }

    body.presentation-mode.show-presentation-controls
      .presentation-controls {
      opacity: 1;
    }

    .presentation-controls button {
      border: 0;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .presentation-counter {
      color: #fff;
      font-size: 13px;
      min-width: 64px;
      text-align: center;
    }

    /* =========================
       ANNOTATION
       ========================= */

    #annotationCanvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9000;
      pointer-events: none;
      touch-action: none;
    }

    body.presentation-mode #annotationCanvas {
      display: block;
    }

    body.annotation-drawing #annotationCanvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    .annotation-btn.active {
      background: #2563eb;
      color: #fff;
    }

    #annotationColor {
      width: 32px;
      height: 32px;
      padding: 2px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    #writingPanel {
      box-sizing: border-box;
      margin: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #dbe3ed;
      border-radius: 10px;
      color: #172338;
      overflow: auto;
      max-height: 40vh;
      flex-shrink: 0;
    }
    #writingPanel > summary { cursor: pointer; font-weight: 650; }
    #writingPanel h2 { margin: 0 0 8px; font-size: 1.1rem; }
    #writingPanel form { margin: 10px 0; }
    #writingPanel textarea {
      box-sizing: border-box;
      display: block;
      width: min(100%, 48rem);
      margin: 6px 0 10px;
      padding: 9px 10px;
      border: 1px solid #b5c4d5;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
    }
    #writingPanel button {
      background: #2459a9;
      border: 0;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    #writingPanel button:disabled { opacity: .55; cursor: default; }
    #writingPanel p { margin: 8px 0; }
    #writingPanel p:empty { display: none; }
    #writingResults details { border-top: 1px solid #e1e8f0; padding: 8px 0; }
    #writingResults summary { cursor: pointer; }
    body.presentation-mode #writingPanel { display: none; }
  </style>
<link rel="stylesheet" href="runtime-ui.css?v=1">
  <link rel="stylesheet" href="classroom-ui.css?v=3">
</head>
<body>
  <header>
    <div class="title">
      <h1 id="lessonTitle">Loading lesson...</h1>
      <p id="lessonMeta"></p>
    </div>

    <div class="controls">
      <button id="homeBtn">⌂ Home</button>
      <button id="prevBtn">← Previous</button>
      <button id="nextBtn">Next →</button>
      <button id="presentationBtn">Present</button>
      <button id="expandSlide" aria-pressed="false">Expand slide</button>
      <button id="startSessionBtn">Start Session</button>
      <button id="endSessionBtn" disabled>End Session</button>
      <label>Student mode
        <select id="displayMode" disabled>
          <option value="focus">Focus · Look at the board</option>
          <option value="follow" selected>Follow · Follow the teacher</option>
          <option value="interact">Interact · Allow interaction</option>
        </select>
      </label>
      <span id="displayModeStatus" role="status"></span>

      <details class="reh-tools">
        <summary>More actions</summary>
        <div>

          <button type="button" id="editWorkLesson" hidden>Edit</button>

          <button type="button" id="sessionResultsLink" data-destination="session-results.html">Results</button>

        </div>
      </details>
    </div>
  </header>
  <main class="app">
    <aside class="sidebar" id="blockList"></aside>

    <section class="preview">
      <div class="current" id="currentBlock">Current block: —</div>

      <details id="teacherNotes" open hidden>
        <summary>Teacher notes</summary>
        <div id="teacherNotesText"></div>
      </details>
      <div class="reveal-tools"><button id="previousReveal" hidden>Previous reveal</button>
      <button id="nextReveal" hidden>Next reveal</button>
      <span id="revealStatus" role="status"></span></div>
      <div id="taskStage" hidden>
        <div id="taskContent"></div>
        <div class="task-actions">
          <button id="assignOnStage" disabled>Assign prepared task</button>
          <button id="reviewTask" hidden aria-pressed="false">Show answer key</button>
          <span id="taskStageStatus" role="status"></span>
        </div>
      </div>
      <iframe id="previewFrame"></iframe>
      <div class="error" id="errorBox" style="display:none;"></div>
    </section>
    <details class="live-panel" open>
      <summary>Live Session</summary>
      <div id="sessionAccess"></div>
      <p id="sessionBanner" role="status">Start a session to invite students.</p>
      <a id="showJoinSession" target="_blank" rel="noopener" hidden>Open Join Screen</a>
      <button id="copyStudentBtn" hidden>Copy Join Link</button>
      <div id="monitorPanel" hidden></div>
      <details id="writingPanel">

    <summary>Tasks · Assignments and responses</summary>
    <form id="writingAssignForm">
      <label>Task type
        <select name="taskType"><option value="writing">Writing</option><option value="speaking">Speaking</option><option value="multiple_choice">Multiple choice</option></select>
      </label>
      <label>Phase
        <select name="evidencePhase">
          <option value="">Unspecified</option>
          <option value="diagnosis">Diagnosis</option>
          <option value="teach">Teach</option>
          <option value="practice">Practice</option>
          <option value="retrieve">Retrieve</option>
          <option value="production">Production</option>
          <option value="verify">Verify</option>
        </select>
      </label>
      <label>Learning target ID <input name="learningTarget" list="learningTargets" maxlength="120" placeholder="Optional, e.g. grammar.subject-verb"></label>
      <label>Prompt <textarea name="prompt" rows="3" maxlength="4000" required></textarea></label>
      <fieldset id="quizOptions" hidden>
        <legend>Quiz questions</legend>
        <label><input type="checkbox" name="shuffle"> Shuffle options for each student</label>
        <div id="quizQuestions"></div>
        <button type="button" id="addQuizQuestion">Add question</button>
      </fieldset>
      <button type="submit" id="assignQuick" hidden>Quick assign</button>
      <button type="button" id="prepareWriting">Save task after this block</button>
      <button type="button" id="copyLessonLink">Copy lesson link</button>
    </form>
    <p id="preparedPrompt" style="white-space:pre-wrap" hidden></p>
    <button type="button" id="assignPrepared" hidden>Assign prepared task</button>
    <button type="button" id="writingExport" hidden>Export CSV</button>
    <p id="writingFeedback" role="status"></p>
    <p id="writingCount"></p>
    <div id="writingResults"></div>
  </details>
    </details>
  </main>

  <canvas id="annotationCanvas"></canvas>

  <div class="presentation-controls" id="presentationControls">
    <button id="presentationPrevBtn">←</button>
    <span class="presentation-counter" id="presentationCounter">1 / 1</span>
    <button id="presentationNextBtn">→</button>

    <button
      id="annotationPointerBtn"
      class="annotation-btn active"
      title="Pointer (V)"
    >
      ↖ Pointer
    </button>

    <button
      id="annotationPenBtn"
      class="annotation-btn"
      title="Pen (P)"
    >
      ✎ Pen
    </button>

    <button
      id="annotationEraserBtn"
      class="annotation-btn"
      title="Eraser (E)"
    >
      ◻ Eraser
    </button>

    <input
      id="annotationColor"
      type="color"
      value="#e11d48"
      title="Pen color"
    />

    <button
      id="annotationClearBtn"
      title="Clear annotations (C)"
    >
      Clear
    </button>
    
    <button id="exitPresentationBtn">Exit</button>
  </div>

  <script src="./config.js?v=3"></script>
  <script src="catalog-options.js" defer></script>
  <script>
    const BASE_URL =
      window.ELT_CONFIG?.BASE_URL ||
      "https://rootenglishhouse.com/";

    const API_BASE =
      window.ELT_CONFIG?.API_BASE ||
      "https://elt-production.up.railway.app/api";

    console.log("ELT_CONFIG", window.ELT_CONFIG);
    console.log("API_BASE", API_BASE);
    console.log("BASE_URL", BASE_URL);

    const params = new URLSearchParams(window.location.search);

    const lessonPath =
      params.get("lesson") ||
      "lessons/g1rec/l02/g1rec-l02.json";

    let blockIndex = Number(params.get("block") || 0);

    const teacherTokenInput = document.createElement("input");
    teacherTokenInput.type = "password";
    teacherTokenInput.placeholder = "Staging teacher access code";
    teacherTokenInput.setAttribute("aria-label", "Staging teacher access code");
    teacherTokenInput.autocomplete = "off";
    teacherTokenInput.dataset.targetCatalogCode = "";
    document.getElementById("sessionAccess").append(teacherTokenInput);
    let teacherToken = "";
    function teacherHeaders() {
      return teacherToken ? { Authorization: "Bearer " + teacherToken } : {};
    }

    const teacherNotes = document.getElementById("teacherNotes");
    const teacherNotesText = document.getElementById("teacherNotesText");
    let notesByBlock = null;
    let notesCode = null;
    let notesTimer;

    function renderTeacherNotes() {
      if (teacherNotes.hidden) return;
      const block = currentLesson?.blocks[blockIndex];
      teacherNotesText.textContent = notesByBlock
        ? notesByBlock.get(block?.id) || "No notes for this block."
        : "Enter the teacher access code in Live Session to view notes.";
    }

    async function loadTeacherNotes() {
      if (teacherNotes.hidden) return;
      const code = teacherTokenInput.value.trim();
      if (notesByBlock && notesCode === code) return;
      notesByBlock = null;
      notesCode = code;
      renderTeacherNotes();
      try {
        const response = await fetch(`${API_BASE}/work-lessons/${lessonPath.split("/")[1]}`, {
          headers: code ? { Authorization: "Bearer " + code } : {},
          cache: "no-store"
        });
        if (notesCode !== code || teacherTokenInput.value.trim() !== code) return;
        if (!response.ok) {
          if (code) teacherNotesText.textContent = "Could not load teacher notes. Check the access code.";
          return;
        }
        const { lesson } = await response.json();
        if (notesCode !== code || teacherTokenInput.value.trim() !== code) return;
        notesByBlock = new Map(lesson.blocks.map(block => [block.id, block.notes?.trim()]));
        renderTeacherNotes();
      } catch {
        if (notesCode === code && teacherTokenInput.value.trim() === code) {
          teacherNotesText.textContent = "Could not load teacher notes. Try entering the access code again.";
        }
      }
    }

    teacherTokenInput.addEventListener("input", () => {
      clearTimeout(notesTimer);
      notesByBlock = null;
      notesCode = null;
      renderTeacherNotes();
      notesTimer = setTimeout(loadTeacherNotes, 400);
    });

    const lessonUrl = window.runtimeLessonUrl(lessonPath);

    const lessonTitle = document.getElementById("lessonTitle");
    const lessonMeta = document.getElementById("lessonMeta");
    const blockList = document.getElementById("blockList");
    const currentBlock = document.getElementById("currentBlock");
    const previewFrame = document.getElementById("previewFrame");
    const errorBox = document.getElementById("errorBox");
    const startSessionBtn = document.getElementById("startSessionBtn");
    const endSessionBtn = document.getElementById("endSessionBtn");
    const sessionBanner = document.getElementById("sessionBanner");
    const monitorPanel = document.getElementById("monitorPanel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const homeBtn = document.getElementById("homeBtn");
    const copyStudentBtn = document.getElementById("copyStudentBtn");

    const presentationBtn =
      document.getElementById("presentationBtn");

    const presentationPrevBtn =
      document.getElementById("presentationPrevBtn");

    const presentationNextBtn =
      document.getElementById("presentationNextBtn");

    const exitPresentationBtn =
      document.getElementById("exitPresentationBtn");

    const presentationCounter =
      document.getElementById("presentationCounter");

    const annotationCanvas =
      document.getElementById("annotationCanvas");

    const annotationPointerBtn =
      document.getElementById("annotationPointerBtn");

    const annotationPenBtn =
      document.getElementById("annotationPenBtn");

    const annotationEraserBtn =
      document.getElementById("annotationEraserBtn");

    const annotationClearBtn =
      document.getElementById("annotationClearBtn");

    const annotationColor =
      document.getElementById("annotationColor");

    let currentLesson = null;
    let sessionPin = null;
    let slideStep = 0;
    let revealPending = false;
    const previousReveal = document.getElementById("previousReveal");
    const nextReveal = document.getElementById("nextReveal");
    const revealStatus = document.getElementById("revealStatus");

    function revealSteps() {
      const elements = currentLesson?.blocks[blockIndex]?.elements || [];
      return [...new Set([0, ...elements.flatMap(element => [element.appear, element.disappear])
        .filter(step => Number.isInteger(step))])].sort((a, b) => a - b);
    }

    let projectionWindow;
    let projectionFrame;
    let projectionTask;
    const taskStage = document.getElementById("taskStage");
    const taskContent = document.getElementById("taskContent");
    const assignOnStage = document.getElementById("assignOnStage");
    const reviewTask = document.getElementById("reviewTask");
    const taskStageStatus = document.getElementById("taskStageStatus");

    function syncProjection() {
      if (!projectionWindow || projectionWindow.closed) return;
      projectionFrame.style.display = taskStage.hidden ? "block" : "none";
      projectionTask.hidden = taskStage.hidden;
      if (taskStage.hidden) projectionFrame.src = previewFrame.src;
      else projectionTask.replaceChildren(taskContent.cloneNode(true));
    }

    function renderTaskPreview(block) {
      const task = block.task;
      taskStage.hidden = !task;
      taskContent.replaceChildren();
      taskStageStatus.textContent = "";
      reviewTask.setAttribute("aria-pressed", "false");
      reviewTask.textContent = "Show answer key";
      const assigned = sessionPin && [...latestTasks].reverse().find(item => item.block_id === block.id);
      const quiz = task?.quiz || block.quiz;
      const questions = assigned?.questions || task?.questions || quiz?.questions ||
        (Array.isArray(quiz?.options) ? [{ ...quiz, prompt: task.prompt }] : []);
      reviewTask.hidden = !questions.some(question => Number.isInteger(question.correct_option));
      if (!task) return;
      const heading = document.createElement("h2");
      heading.textContent = block.title || "Prepared task";
      const prompt = document.createElement("p");
      prompt.textContent = task.prompt || "";
      taskContent.append(heading, prompt);
      if (!questions.length) return;
      const list = document.createElement("ol");
      for (const question of questions) {
        const item = document.createElement("li");
        const questionText = document.createElement("p");
        questionText.textContent = question.prompt;
        const options = document.createElement("ol");
        options.type = "A";
        question.options.forEach((option, index) => {
          const row = document.createElement("li");
          row.textContent = option;
          if (index === question.correct_option) {
            const key = document.createElement("strong");
            key.dataset.answerKey = "";
            key.hidden = true;
            key.textContent = " · Correct answer";
            row.append(key);
          }
          options.append(row);
        });
        item.append(questionText, options);
        list.append(item);
      }
      taskContent.append(list);
    }

    reviewTask.addEventListener("click", () => {
      const shown = reviewTask.getAttribute("aria-pressed") === "true";
      reviewTask.setAttribute("aria-pressed", String(!shown));
      reviewTask.textContent = shown ? "Show answer key" : "Hide answer key";
      taskContent.querySelectorAll("[data-answer-key]").forEach(key => { key.hidden = shown; });
      if (projectionWindow && !projectionWindow.closed && !taskStage.hidden) {
        projectionTask.replaceChildren(taskContent.cloneNode(true));
      }
    });

    function showReveal() {
      const steps = revealSteps();
      previousReveal.hidden = nextReveal.hidden = steps.length === 1;
      const index = steps.indexOf(slideStep);
      previousReveal.disabled = revealPending || index <= 0;
      nextReveal.disabled = revealPending || index >= steps.length - 1;
      revealStatus.textContent = steps.length > 1 ? "Reveal " + (index + 1) + "/" + steps.length : "";
      const message = { type: "reh-slide-step", block: currentLesson?.blocks[blockIndex]?.id,
        step: slideStep, interactive: true };
      previewFrame.contentWindow?.postMessage(message, location.origin);
      if (projectionWindow && !projectionWindow.closed) {
        projectionFrame?.contentWindow?.postMessage(message, location.origin);
      }
    }

    async function changeReveal(direction) {
      const steps = revealSteps();
      const step = steps[steps.indexOf(slideStep) + direction];
      if (step === undefined || revealPending) return;
      const pin = sessionPin;
      const block = blockIndex;
      revealPending = true;
      showReveal();
      let failed = false;
      try {
        if (pin && !endSessionBtn.disabled) {
          const response = await fetch(`${API_BASE}/sessions/${pin}/slide-step`, {
            method: "POST",
            headers: { ...teacherHeaders(), "Content-Type": "application/json" },
            body: JSON.stringify({ block_index: block, step })
          });
          if (!response.ok) throw new Error("Could not change reveal");
        }
        if (block === blockIndex && pin === sessionPin) slideStep = step;
      } catch {
        failed = true;
      } finally {
        revealPending = false;
        showReveal();
        if (failed) revealStatus.textContent = "Could not sync reveal. Try again.";
      }
    }
    previousReveal.onclick = () => changeReveal(-1);
    nextReveal.onclick = () => changeReveal(1);
    previewFrame.addEventListener("load", showReveal);
    window.addEventListener("message", event => {
      if (event.origin === location.origin && (event.source === previewFrame.contentWindow || event.source === projectionFrame?.contentWindow)
          && event.data?.type === "reh-slide-ready") showReveal();
    });
    const writingPanel = document.getElementById("writingPanel");
    const writingAssignForm = document.getElementById("writingAssignForm");
    const writingExport = document.getElementById("writingExport");
    const writingFeedback = document.getElementById("writingFeedback");
    const writingCount = document.getElementById("writingCount");
    const writingResults = document.getElementById("writingResults");

    const assignQuick = document.getElementById("assignQuick");
    const prepareWriting = document.getElementById("prepareWriting");
    const copyLessonLink = document.getElementById("copyLessonLink");
    const assignPrepared = document.getElementById("assignPrepared");
    const preparedPrompt = document.getElementById("preparedPrompt");
    let lastWritingSummary = "";
    const quizOptions = document.getElementById("quizOptions");
    const quizQuestions = document.getElementById("quizQuestions");
    const addQuizQuestion = document.getElementById("addQuizQuestion");

    function addQuestion() {
      if (quizQuestions.children.length >= 30) return;
      const row = document.createElement("fieldset");
      row.innerHTML = `
        <legend>Question</legend>
        <label>Question text <textarea data-question rows="2" maxlength="4000"></textarea></label>
        <label>Learning target override <input data-target list="learningTargets" maxlength="120"></label>
        <label>Options (2–8, one per line) <textarea data-options rows="4"></textarea></label>
        <label>Correct option <select data-correct>
          ${Array.from("ABCDEFGH", (letter, index) => '<option value="' + index + '">' + letter + '</option>').join("")}
        </select></label>
        <button type="button" data-remove>Remove question</button>`;
      row.querySelector("[data-remove]").addEventListener("click", () => {
        if (quizQuestions.children.length > 1) row.remove();
        updateQuestionNumbers();
      });
      quizQuestions.append(row);
      updateQuestionNumbers();
    }

    function updateQuestionNumbers() {
      [...quizQuestions.children].forEach((row, index) => {
        row.querySelector("legend").textContent = "Question " + (index + 1);
        row.querySelector("[data-remove]").disabled = quizQuestions.children.length === 1;
      });
      addQuizQuestion.disabled = quizQuestions.children.length >= 30;
    }

    function syncTaskType() {
      quizOptions.hidden = writingAssignForm.elements.taskType.value !== "multiple_choice";
      writingAssignForm.elements.prompt.required = quizOptions.hidden;
      if (!quizOptions.hidden && !quizQuestions.children.length) addQuestion();
    }
    addQuizQuestion.addEventListener("click", addQuestion);
    writingAssignForm.elements.taskType.addEventListener("change", syncTaskType);

    function taskPayload(prompt) {
      const context = { phase: writingAssignForm.elements.evidencePhase.value || null,
        learning_target_id: writingAssignForm.elements.learningTarget.value.trim() || null };
      if (writingAssignForm.elements.taskType.value !== "multiple_choice") {
        if (!prompt) throw new Error("Enter a task prompt.");
        return { ...context, prompt, speaking: writingAssignForm.elements.taskType.value === "speaking" };
      }
      const questions = [...quizQuestions.children].map((row, index) => {
        const question = row.querySelector("[data-question]").value.trim();
        const options = row.querySelector("[data-options]").value.trim().split(/\r?\n/).map(option => option.trim());
        const correct_option = Number(row.querySelector("[data-correct]").value);
        if (!question || options.length < 2 || options.length > 8 || options.some(option => !option)
            || new Set(options).size !== options.length || correct_option >= options.length) {
          throw new Error("Question " + (index + 1) + ": enter a question, 2–8 distinct options and a valid correct option.");
        }
        return { prompt: question, options, correct_option,
          learning_target_id: row.querySelector("[data-target]").value.trim() || null };
      });
      return { ...context, prompt: prompt || "Multiple-choice quiz", quiz: { questions, shuffle: writingAssignForm.elements.shuffle.checked } };
    }

    function syncWritingControls() {
      const live = Boolean(sessionPin) && !endSessionBtn.disabled;
      const prepared = currentLesson?.blocks[blockIndex]?.task;
      prepareWriting.hidden = live || currentLesson?.origin === "work";
      copyLessonLink.hidden = live;
      assignQuick.hidden = !live;
      assignPrepared.hidden = !live || !prepared;
      assignOnStage.disabled = !live || !prepared;
      if (prepared && !live) taskStageStatus.textContent = "Start a session to assign this task.";
      else if (live && taskStageStatus.textContent === "Start a session to assign this task.") taskStageStatus.textContent = "";
      preparedPrompt.hidden = !prepared;
      preparedPrompt.textContent = prepared ? prepared.prompt : "";
      writingAssignForm.hidden = !live && currentLesson?.origin === "work";
    }

    async function writingRequest(path, payload) {
      const response = await fetch(API_BASE + path, {
        method: "POST",
        headers: { ...teacherHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : "Could not save the task.");
      return result;
    }

    prepareWriting.addEventListener("click", async () => {
      const prompt = writingAssignForm.elements.prompt.value.trim();
      if (!currentLesson || !lessonPath.startsWith("imports/")) {
        writingFeedback.textContent = "Open an imported deck before saving a task block.";
        return;
      }
      teacherToken = teacherTokenInput.value.trim();
      prepareWriting.disabled = true;
      try {
        const result = await writingRequest("/" + lessonPath + "/writing-blocks", { ...taskPayload(prompt), after_block: blockIndex });
        const next = new URL(location.href);
        next.searchParams.set("lesson", result.lesson_path);
        next.searchParams.set("block", result.block_index);
        location.assign(next.href);
      } catch (error) {
        writingFeedback.textContent = error.message;
      } finally {
        prepareWriting.disabled = false;
      }
    });

    copyLessonLink.addEventListener("click", async () => {
      const link = new URL(location.href);
      link.searchParams.delete("block");
      try {
        await navigator.clipboard.writeText(link.href);
        writingFeedback.textContent = "Lesson link copied.";
      } catch {
        writingFeedback.textContent = "Copy the lesson URL from the address bar.";
      }
    });

    async function assignWriting(payload, button) {
      if (!sessionPin) return;
      button.disabled = true;
      if (payload.block_id) assignPrepared.disabled = assignOnStage.disabled = true;
      try {
        const pin = sessionPin;
        const result = await writingRequest(`/sessions/${pin}/tasks/writing`, payload);
        if (pin !== sessionPin || endSessionBtn.disabled) return;
        if (result.display_mode === "interact") {
          savedDisplayMode = displayMode.value = "interact";
          displayModeStatus.textContent = "";
        }
        writingFeedback.textContent = "Assigned. Students can now submit in Interact mode.";
        if (payload.block_id === currentLesson.blocks[blockIndex]?.id) taskStageStatus.textContent = writingFeedback.textContent;
        if (payload.prompt) {
          writingAssignForm.reset();
          quizQuestions.replaceChildren();
          syncTaskType();
        }
        await updateWritingResults(sessionPin);
      } catch (error) {
        writingFeedback.textContent = error.message;
        if (payload.block_id === currentLesson.blocks[blockIndex]?.id) taskStageStatus.textContent = error.message;
      } finally {
        button.disabled = false;
        if (payload.block_id) {
          assignPrepared.disabled = false;
          syncWritingControls();
        }
      }
    }

    writingAssignForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const prompt = writingAssignForm.elements.prompt.value.trim();
      if (!assignQuick.hidden) {
        try {
          assignWriting(taskPayload(prompt), assignQuick);
        } catch (error) {
          writingFeedback.textContent = error.message;
        }
      }
    });
    for (const button of [assignPrepared, assignOnStage]) {
      button.addEventListener("click", () => {
        assignWriting({ block_id: currentLesson.blocks[blockIndex].id }, button);
      });
    }

    let latestTasks = [];
    async function updateWritingResults(pin) {
      const response = await fetch(`${API_BASE}/sessions/${pin}/tasks/results`, { headers: teacherHeaders() });
      if (!response.ok || pin !== sessionPin) return;
      const result = await response.json();
      if (pin !== sessionPin) return;
      latestTasks = result.tasks;
      const block = currentLesson?.blocks[blockIndex];
      if (block?.task && reviewTask.hidden && latestTasks.some(task => task.block_id === block.id && task.questions?.length)) {
        const feedback = taskStageStatus.textContent;
        renderTaskPreview(block);
        taskStageStatus.textContent = feedback;
        syncProjection();
      }
      writingExport.hidden = !result.tasks.length;
      const summary = JSON.stringify([result.joined, result.tasks.map(task => [task.task_id, task.submissions.length, task.scores_published])]);
      if (summary === lastWritingSummary) return;
      lastWritingSummary = summary;
      const open = new Set([...writingResults.querySelectorAll("details[open]")].map(row => row.id));
      writingCount.textContent = `Assigned tasks: ${result.tasks.length}`;
      writingResults.querySelectorAll("audio").forEach(player => URL.revokeObjectURL(player.src));
      writingResults.replaceChildren(...result.tasks.map((task, index) => {
        const group = document.createElement("details");
        group.id = task.task_id;
        group.open = open.has(group.id) || index === result.tasks.length - 1;
        const label = document.createElement("summary");
        label.textContent = `${task.block_id ? "Prepared" : "Quick"} #${index + 1} · Submitted: ${task.submissions.length}/${result.joined}`;
        const prompt = document.createElement("p");
        prompt.textContent = task.prompt;
        group.append(label, prompt);
        if (task.type === "multiple_choice") {
          const key = document.createElement("p");
          key.textContent = task.questions.map((question, index) =>
            `Q${index + 1}: ${question.options[question.correct_option]}`).join(" · ");
          const publish = document.createElement("button");
          publish.type = "button";
          publish.textContent = task.scores_published ? "Scores published" : "Publish scores";
          publish.disabled = task.scores_published || !task.submissions.length;
          publish.addEventListener("click", async () => {
            publish.disabled = true;
            try {
              await writingRequest(`/sessions/${pin}/tasks/${task.task_id}/publish-scores`, {});
              await updateWritingResults(pin);
            } catch (error) {
              writingFeedback.textContent = error.message;
              publish.disabled = false;
            }
          });
          group.append(key, publish);
        }
        for (const submission of task.submissions) {
          const row = document.createElement("details");
          row.id = task.task_id + "-" + submission.student_id;
          row.open = open.has(row.id);
          const name = document.createElement("summary");
          const answer = document.createElement("p");
          name.textContent = submission.student_name;
          answer.textContent = task.type === "multiple_choice"
            ? `${submission.selected_option} · Score: ${submission.score}/${submission.max_score}`
            : submission.response;
          answer.style.whiteSpace = "pre-wrap";
          row.append(name);
          if (task.type === "speaking") {
            const listen = document.createElement("button");
            listen.type = "button";
            listen.textContent = "Load recording";
            listen.addEventListener("click", async () => {
              listen.disabled = true;
              try {
                const response = await fetch(`${API_BASE}/sessions/${pin}/tasks/${task.task_id}/speaking/${submission.student_id}`, {
                  headers: teacherHeaders()
                });
                if (!response.ok) throw new Error("Could not load the recording.");
                const player = document.createElement("audio");
                player.controls = true;
                player.src = URL.createObjectURL(await response.blob());
                row.append(player);
                listen.remove();
              } catch (error) {
                writingFeedback.textContent = error.message;
                listen.disabled = false;
              }
            });
            row.append(listen);
          } else {
            row.append(answer);
          }
          group.append(row);
        }
        return group;
      }));
    }

    writingExport.addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/sessions/${sessionPin}/tasks/export`, { headers: teacherHeaders() });
        if (!response.ok) throw new Error("Could not export the CSV.");
        const link = document.createElement("a");
        link.href = URL.createObjectURL(await response.blob());
        link.download = `writing-${sessionPin}.csv`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      } catch (error) {
        writingFeedback.textContent = error.message;
      }
    });
    const displayMode = document.getElementById("displayMode");
    const displayModeStatus = document.getElementById("displayModeStatus");
    let savedDisplayMode = "follow";

    displayMode.addEventListener("change", async () => {
      const pin = sessionPin;
      const mode = displayMode.value;
      displayMode.disabled = true;
      displayModeStatus.textContent = "Updating…";
      try {
        const response = await fetch(`${API_BASE}/sessions/${pin}/mode`, {
          method: "POST",
          headers: { ...teacherHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ mode })
        });
        if (!response.ok) throw new Error("Mode update failed");
        if (sessionPin === pin && !endSessionBtn.disabled) {
          savedDisplayMode = mode;
          displayModeStatus.textContent = "Updated";
        }
      } catch {
        if (sessionPin === pin && !endSessionBtn.disabled) {
          displayMode.value = savedDisplayMode;
          displayModeStatus.textContent = "Could not change the mode. Try again.";
        }
      } finally {
        if (sessionPin === pin && !endSessionBtn.disabled) displayMode.disabled = false;
      }
    });
    let monitorTimer = null;
    let isPresentationMode = false;
    let presentationControlsTimer = null;

    let annotationMode = "pointer";
    let annotationDrawing = false;
    let annotationLastX = 0;
    let annotationLastY = 0;
    let annotationCtx = null;

    async function loadLesson() {
      try {
        const res = await fetch(lessonUrl);

        if (!res.ok) {
          throw new Error("Cannot load lesson JSON: " + lessonUrl);
        }

        currentLesson = await res.json();
        teacherNotes.hidden = currentLesson.origin !== "work" || !/^imports\/[a-f0-9]{32}$/.test(lessonPath);
        void loadTeacherNotes();
        const catalogueId = params.get("catalogue");
        if (currentLesson.origin === "work") {
          const edit = document.getElementById("editWorkLesson");
          const editor = new URL("author.html", BASE_URL);
          editor.searchParams.set("revision", lessonPath.split("/")[1]);
          if (catalogueId) editor.searchParams.set("catalogue", catalogueId);
          edit.dataset.destination = editor.href;
          edit.hidden = false;
        }

        lessonTitle.textContent =
          currentLesson.title || currentLesson.lesson_id || "Lesson";

        lessonMeta.textContent =
          [currentLesson.level, currentLesson.version && `Version ${currentLesson.version}`].filter(Boolean).join(" · ");

        renderBlockList(currentLesson.blocks || []);
        goToBlock(blockIndex, false);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderBlockList(blocks) {
      blockList.innerHTML = "";

      blocks.forEach((block, index) => {
        const btn = document.createElement("button");
        btn.className = "block-btn";
        btn.dataset.index = index;
        btn.textContent = `${index + 1}. ${(block.phase ? block.phase.toUpperCase() + " · " : "") + (block.title || block.id)}`;
        btn.onclick = () => {
          goToBlock(index);
          syncSessionSetBlock(index);
        };

        blockList.appendChild(btn);
      });
    }

    function goToBlock(index, updateUrl = true) {
      if (!currentLesson) return;

      const blocks = currentLesson.blocks || [];

      if (index < 0 || index >= blocks.length) return;

      const block = blocks[index];

      if (block.type !== "activity") {
        showError("Unsupported block type: " + block.type);
        return;
      }

      blockIndex = index;
      renderTeacherNotes();
      slideStep = 0;
      showReveal();

      document.querySelectorAll(".block-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === blockIndex);
      });

      currentBlock.textContent =
        `Current block: ${blockIndex + 1}/${blocks.length} · ${block.title || block.id} · ${block.activity_kind || block.type}`;

      previewFrame.src = block.task ? "about:blank" : window.runtimePlayerUrl(block, "teacher");
      renderTaskPreview(block);
      syncProjection();
      syncWritingControls();
      previewFrame.style.display = block.task ? "none" : "block";
      errorBox.style.display = "none";

      prevBtn.disabled = blockIndex <= 0;
      nextBtn.disabled = blockIndex >= blocks.length - 1;

      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("lesson", lessonPath);
        url.searchParams.set("block", blockIndex);
        window.history.replaceState({}, "", url.toString());
      }
      
      if (presentationCounter) {
        presentationCounter.textContent =
          `${blockIndex + 1} / ${blocks.length}`;
      }

      clearAnnotations();
    }

    function buildStudentUrl() {
      const url = new URL("join.html", BASE_URL);
      url.searchParams.set("pin", sessionPin);
      return url.href;
    }

    const showJoinSession = document.getElementById("showJoinSession");
    let joinWindow;

    function openJoinScreen(url) {
      if (joinWindow && !joinWindow.closed) {
        joinWindow.location.href = url;
        joinWindow.focus();
      } else {
        joinWindow = window.open(url, "_blank", "popup,width=860,height=760");
      }
    }

    showJoinSession.addEventListener("click", event => {
      event.preventDefault();
      openJoinScreen(showJoinSession.href);
      if (!joinWindow) alert("Allow pop-ups to open the Join Screen.");
    });

    async function startSession() {
      if (!currentLesson || startSessionBtn.disabled) return;
      const joinScreen = new URL("join-screen.html", BASE_URL);
      openJoinScreen(joinScreen.href);

      try {
        startSessionBtn.disabled = true;
        startSessionBtn.textContent = "Starting...";

        teacherToken = teacherTokenInput.value.trim();
        const res = await fetch(`${API_BASE}/sessions/start`, {
          method: "POST",
          headers: {
            ...teacherHeaders(),
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            lesson_id: currentLesson.lesson_id,
            lesson_path: lessonPath,
            total_blocks: currentLesson.blocks.length,
            current_block_index: blockIndex,
          }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Failed to start session: ${res.status} ${text}`);
        }

        const session = await res.json();

        sessionPin = session.pin;
        latestTasks = [];
        renderTaskPreview(currentLesson.blocks[blockIndex]);
        syncProjection();
        slideStep = session.slide_step || 0;
        showReveal();
        document.getElementById("sessionResultsLink").dataset.destination = "session-results.html?pin=" + encodeURIComponent(sessionPin);
        document.getElementById("editWorkLesson").hidden = true;
        writingPanel.hidden = false;
        writingAssignForm.hidden = false;
        writingExport.hidden = true;
        writingFeedback.textContent = "";
        writingCount.textContent = "";
        writingResults.querySelectorAll("audio").forEach(player => URL.revokeObjectURL(player.src));
        writingResults.replaceChildren();
        lastWritingSummary = "";
        savedDisplayMode = session.display_mode || "follow";
        displayMode.value = savedDisplayMode;
        displayMode.disabled = false;
        displayModeStatus.textContent = "";
        
        sessionBanner.style.display = "block";
        sessionBanner.textContent =
          `Live · PIN ${session.pin}`;

        monitorPanel.hidden = false;
        monitorPanel.replaceChildren();
        copyStudentBtn.hidden = false;
        joinScreen.searchParams.set("pin", sessionPin);
        showJoinSession.href = joinScreen.href;
        showJoinSession.hidden = false;
        teacherTokenInput.hidden = true;
        void loadTeacherNotes();
        startMonitorPolling();
        
        startSessionBtn.textContent = "Session Active";
        endSessionBtn.disabled = false;
        syncWritingControls();
        if (joinWindow && !joinWindow.closed) joinWindow.location.replace(joinScreen.href);
      } catch (err) {
        console.error(err);
        joinWindow?.close();
        alert("Could not start session: " + err.message);
        startSessionBtn.disabled = false;
        startSessionBtn.textContent = "Start Session";
      }
    }

    async function syncSessionBlock(direction) {
      if (!sessionPin) return;

      try {
        await fetch(
          `${API_BASE}/sessions/${sessionPin}/${direction}`,
          {
            method: "POST",
            headers: teacherHeaders(),
          }
        );
      } catch (err) {
        console.error(err);
      }
    }

    async function syncSessionSetBlock(index) {
      if (!sessionPin) return;

      console.log("SYNC SET BLOCK", index, "PIN", sessionPin);
    
      const res = await fetch(
        `${API_BASE}/sessions/${sessionPin}/block/${index}`,
        {
          method: "POST",
          headers: teacherHeaders(),
        }
      );
    
      if (!res.ok) {
        throw new Error("Failed to sync block index: " + index);
      }
    
      return await res.json();
    }

    async function endSession() {
      if (!sessionPin) return;

      try {
        const res = await fetch(`${API_BASE}/sessions/${sessionPin}/end`, {
          method: "POST",
          headers: teacherHeaders(),
        });

        if (!res.ok) {
          throw new Error("Failed to end session");
        }

        sessionBanner.textContent = `Session ended · PIN ${sessionPin}`;
        showJoinSession.hidden = true;
        joinWindow?.close();
        teacherTokenInput.hidden = false;
        startSessionBtn.disabled = false;
        startSessionBtn.textContent = "Start Session";
        endSessionBtn.disabled = true;
        syncWritingControls();
        displayMode.disabled = true;
        displayModeStatus.textContent = "";

        if (monitorTimer) {
          clearInterval(monitorTimer);
          monitorTimer = null;
        }
      } catch (err) {
        console.error(err);
        alert("Could not end session: " + err.message);
      }
    }

    function startMonitorPolling() {
      if (!sessionPin) return;

      if (monitorTimer) {
        clearInterval(monitorTimer);
      }

      updateMonitor();

      monitorTimer = setInterval(() => {
        updateMonitor();
      }, 2000);
    }

    async function updateMonitor() {
      const pin = sessionPin;
      if (!pin) return;

      try {
        const res = await fetch(`${API_BASE}/sessions/${pin}/state`, { headers: teacherHeaders() });
        if (!res.ok || pin !== sessionPin) return;
        const session = await res.json();
        if (session.active_writing_task) await updateWritingResults(pin);
        if (pin !== sessionPin || endSessionBtn.disabled) return;

        const students = session.students || [];
        const completed = new Set((session.events || [])
          .filter(event => event.event_type === "block_completed" && event.block_index === blockIndex)
          .map(event => event.student_id));
        const task = session.active_writing_task && latestTasks.at(-1);
        const submissions = new Map((task?.submissions || []).map(item => [item.student_id, item]));
        const total = document.createElement("p");
        total.textContent = task
          ? `Joined: ${students.length} · Submitted: ${submissions.size}/${students.length}`
          : `Joined: ${students.length} · Block complete: ${completed.size}/${students.length}`;
        const list = document.createElement("ul");
        for (const student of students) {
          const row = document.createElement("li");
          const name = document.createElement("strong");
          name.textContent = student.learner_id || student.student_name || "Student";
          const status = document.createElement("span");
          const submitted = submissions.has(student.student_id);
          status.textContent = task ? (submitted ? "Submitted" : "Awaiting submission")
            : (completed.has(student.student_id) ? "Block complete" : "Joined");
          row.append(name, status);
          if (submitted) {
            const view = document.createElement("a");
            const responseId = task.task_id + "-" + student.student_id;
            view.href = "#" + encodeURIComponent(responseId);
            view.textContent = "View response";
            view.addEventListener("click", event => {
              event.preventDefault();
              const response = document.getElementById(responseId);
              if (!response) return;
              writingPanel.open = true;
              response.closest("details").open = true;
              response.parentElement.open = true;
              response.scrollIntoView({ block: "nearest" });
              response.querySelector("summary").focus();
            });
            row.append(view);
          }
          list.append(row);
        }
        const signature = JSON.stringify([pin, task?.task_id, total.textContent, list.textContent]);
        if (monitorPanel.dataset.signature !== signature) {
          monitorPanel.dataset.signature = signature;
          monitorPanel.replaceChildren(total, list);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function showError(message) {
      console.error(message);
      previewFrame.style.display = "none";
      taskStage.hidden = true;
      errorBox.style.display = "block";
      errorBox.textContent = message;
      currentBlock.textContent = "Current block: error";
    }

    function showPresentationControls() {
      if (!isPresentationMode) return;

      document.body.classList.add(
        "show-presentation-controls"
      );

      clearTimeout(presentationControlsTimer);

      presentationControlsTimer = setTimeout(() => {
        document.body.classList.remove(
          "show-presentation-controls"
        );
      }, 1800);
    }

    /* =========================
       ANNOTATION FUNCTIONS
       ========================= */

    function resizeAnnotationCanvas() {
      if (!annotationCanvas) return;

      const dpr = window.devicePixelRatio || 1;

      annotationCanvas.width =
        Math.round(window.innerWidth * dpr);

      annotationCanvas.height =
        Math.round(window.innerHeight * dpr);

      annotationCanvas.style.width =
        `${window.innerWidth}px`;

      annotationCanvas.style.height =
        `${window.innerHeight}px`;

      annotationCtx =
        annotationCanvas.getContext("2d");

      annotationCtx.setTransform(
        dpr, 0, 0, dpr, 0, 0
      );

      annotationCtx.lineCap = "round";
      annotationCtx.lineJoin = "round";
    }

    function clearAnnotations() {
      if (!annotationCanvas) return;

      const ctx =
        annotationCanvas.getContext("2d");

      ctx.clearRect(
        0,
        0,
        annotationCanvas.width,
        annotationCanvas.height
      );
    }

    function setAnnotationMode(mode) {
      annotationMode = mode;

      annotationPointerBtn.classList.toggle(
        "active",
        mode === "pointer"
      );

      annotationPenBtn.classList.toggle(
        "active",
        mode === "pen"
      );

      annotationEraserBtn.classList.toggle(
        "active",
        mode === "eraser"
      );

      document.body.classList.toggle(
        "annotation-drawing",
        mode !== "pointer"
      );

      showPresentationControls();
    }

    function getAnnotationPoint(event) {
      const rect =
        annotationCanvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function beginAnnotation(event) {
      if (
        annotationMode === "pointer" ||
        !isPresentationMode
      ) return;

      event.preventDefault();

      annotationDrawing = true;

      const point =
        getAnnotationPoint(event);

      annotationLastX = point.x;
      annotationLastY = point.y;

      annotationCanvas.setPointerCapture(
        event.pointerId
      );
    }

    function drawAnnotation(event) {
      if (
        !annotationDrawing ||
        annotationMode === "pointer"
      ) return;

      event.preventDefault();

      const point =
        getAnnotationPoint(event);

      if (!annotationCtx) {
        annotationCtx =
          annotationCanvas.getContext("2d");
      }

      annotationCtx.beginPath();
      annotationCtx.moveTo(
        annotationLastX,
        annotationLastY
      );
      annotationCtx.lineTo(
        point.x,
        point.y
      );

      if (annotationMode === "eraser") {
        annotationCtx.globalCompositeOperation =
          "destination-out";

        annotationCtx.lineWidth = 32;
      } else {
        annotationCtx.globalCompositeOperation =
          "source-over";

        annotationCtx.strokeStyle =
          annotationColor.value || "#e11d48";

        annotationCtx.lineWidth = 5;
      }

      annotationCtx.stroke();

      annotationLastX = point.x;
      annotationLastY = point.y;
    }

    function endAnnotation(event) {
      if (!annotationDrawing) return;

      annotationDrawing = false;

      try {
        annotationCanvas.releasePointerCapture(
          event.pointerId
        );
      } catch (_) {}
    }

    async function enterPresentationMode() {
      isPresentationMode = true;

      document.body.classList.add(
        "presentation-mode"
      );

      showPresentationControls();

      resizeAnnotationCanvas();
      setAnnotationMode("pointer");

      try {
        if (
          document.documentElement.requestFullscreen &&
          !document.fullscreenElement
        ) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.warn(
          "Browser fullscreen unavailable:",
          err
        );
      }
    }

    async function exitPresentationMode() {
      isPresentationMode = false;

      setAnnotationMode("pointer");

      document.body.classList.remove(
        "presentation-mode",
        "show-presentation-controls"
      );

      if (document.fullscreenElement) {
        try {
          await document.exitFullscreen();
        } catch (err) {
          console.warn(err);
        }
      }
    }

    function presentationNext() {
      if (!currentLesson) return;

      if (
        blockIndex <
        currentLesson.blocks.length - 1
      ) {
        goToBlock(blockIndex + 1);
        syncSessionSetBlock(blockIndex);
      }
    }

    function presentationPrevious() {
      if (!currentLesson) return;

      if (blockIndex > 0) {
        goToBlock(blockIndex - 1);
        syncSessionSetBlock(blockIndex);
      }
    }

    prevBtn.addEventListener("click", () => {
      goToBlock(blockIndex - 1);
      syncSessionSetBlock(blockIndex);
    });

    nextBtn.addEventListener("click", () => {
      goToBlock(blockIndex + 1);
      syncSessionSetBlock(blockIndex);
    });

    startSessionBtn.addEventListener("click", () => {
      startSession();
    });

    endSessionBtn.addEventListener("click", () => {
      endSession();
    });

    for (const id of ["editWorkLesson", "sessionResultsLink"]) {
      const action = document.getElementById(id);
      action.addEventListener("click", () => {
        window.location.assign(action.dataset.destination);
      });
    }

    copyStudentBtn.addEventListener("click", async () => {
      if (!sessionPin) {
        alert("Start a session before copying the join link.");
        return;
      }
      const studentUrl = buildStudentUrl();

      try {
        await navigator.clipboard.writeText(studentUrl);
        copyStudentBtn.textContent = "Copied!";
        setTimeout(() => {
          copyStudentBtn.textContent = "Copy Join Link";
        }, 1200);
      } catch (err) {
        alert(studentUrl);
      }
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "./teacher-home.html";
    });

    presentationBtn.addEventListener("click", () => {
      if (!projectionWindow || projectionWindow.closed) {
        projectionWindow = window.open("about:blank", "_blank", "popup");
        if (!projectionWindow) {
          alert("Allow pop-ups for this site to open the presentation window.");
          return;
        }
        const page = projectionWindow.document;
        page.title = "Classroom presentation";
        page.body.style.cssText = "margin:0;background:#102339;height:100vh";
        projectionFrame = page.createElement("iframe");
        projectionFrame.title = "Lesson slide";
        projectionFrame.allow = "autoplay; fullscreen";
        projectionFrame.style.cssText = "display:block;width:100%;height:100%;border:0";
        projectionFrame.addEventListener("load", showReveal);
        projectionTask = page.createElement("main");
        projectionTask.style.cssText = "box-sizing:border-box;height:100%;overflow:auto;background:#f7fafc;color:#17283b;padding:clamp(20px,5vw,72px);font:clamp(18px,2.4vw,36px) system-ui;white-space:pre-wrap";
        page.body.append(projectionFrame, projectionTask);
        syncProjection();
      }
      projectionWindow.focus();
    });

    window.addEventListener("pagehide", () => projectionWindow?.close());
    document.getElementById("expandSlide").addEventListener("click", event => {
      const expanded = document.body.classList.toggle("slide-expanded");
      event.currentTarget.setAttribute("aria-pressed", String(expanded));
      event.currentTarget.textContent = expanded ? "Restore layout" : "Expand slide";
    });

    exitPresentationBtn.addEventListener(
      "click",
      exitPresentationMode
    );

    presentationNextBtn.addEventListener(
      "click",
      presentationNext
    );

    presentationPrevBtn.addEventListener(
      "click",
      presentationPrevious
    );

    annotationPointerBtn.addEventListener(
      "click",
      () => setAnnotationMode("pointer")
    );

    annotationPenBtn.addEventListener(
      "click",
      () => setAnnotationMode("pen")
    );

    annotationEraserBtn.addEventListener(
      "click",
      () => setAnnotationMode("eraser")
    );

    annotationClearBtn.addEventListener(
      "click",
      clearAnnotations
    );

    annotationCanvas.addEventListener(
      "pointerdown",
      beginAnnotation
    );

    annotationCanvas.addEventListener(
      "pointermove",
      drawAnnotation
    );

    annotationCanvas.addEventListener(
      "pointerup",
      endAnnotation
    );

    annotationCanvas.addEventListener(
      "pointercancel",
      endAnnotation
    );

    window.addEventListener(
      "resize",
      () => {
        if (isPresentationMode) {
          resizeAnnotationCanvas();
        }
      }
    );

    document.addEventListener(
      "mousemove",
      () => {
        if (isPresentationMode) {
          showPresentationControls();
        }
      }
    );

    document.addEventListener(
      "fullscreenchange",
      () => {
        if (
          isPresentationMode &&
          !document.fullscreenElement
        ) {
          isPresentationMode = false;

          document.body.classList.remove(
            "presentation-mode",
            "show-presentation-controls"
          );
        }
      }
    );

    document.addEventListener("keydown", (e) => {
      if (
        e.target.tagName === "INPUT" ||
        e.target.tagName === "TEXTAREA" ||
        e.target.tagName === "SELECT"
      ) return;

      if (isPresentationMode) {
        if (e.key === "p" || e.key === "P") {
          e.preventDefault();
          setAnnotationMode("pen");
          return;
        }

        if (e.key === "v" || e.key === "V") {
          e.preventDefault();
          setAnnotationMode("pointer");
          return;
        }

        if (e.key === "e" || e.key === "E") {
          e.preventDefault();
          setAnnotationMode("eraser");
          return;
        }

        if (e.key === "c" || e.key === "C") {
          e.preventDefault();
          clearAnnotations();
          return;
        }
        
        if (e.key === "Escape") {
          e.preventDefault();
          
          if (annotationMode !== "pointer") {
            setAnnotationMode("pointer");
          } else {
            exitPresentationMode();
          }
          
          return;
        }

        if (
          e.key === "PageDown" ||
          e.key === "Enter"
        ) {
          e.preventDefault();
          presentationNext();
          return;
        }

        if (e.key === "PageUp") {
          e.preventDefault();
          presentationPrevious();
          return;
        }
      }
      
      // HOME
      if (e.key === "h" || e.key === "H") {
        window.location.href = "./teacher-home.html";
        return;
      }
    
      // NEXT
      if (
        e.key === " " ||
        e.key === "ArrowRight"
      ) {
        e.preventDefault();
    
        if (blockIndex < currentLesson.blocks.length - 1) {
          presentationNext();
        }
    
        return;
      }
    
      // PREVIOUS
      if (e.key === "ArrowLeft") {
        e.preventDefault();
    
        if (blockIndex > 0) {
          presentationPrevious();
        }
    
        return;
      }
    });

    loadLesson();
  </script>
</body>
</html>
