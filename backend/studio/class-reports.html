<!doctype html>
<html lang="en" class="reh-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Reports | REH</title>
<link rel="stylesheet" href="runtime-ui.css?v=reh-1">
<style>
body { max-width: 1150px; margin: auto; padding: 18px; }
section { margin: 14px 0; padding: 16px; border: 1px solid #CCDCC8; border-radius: 12px; background: white; }
form, .class-metrics { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
label { display: grid; gap: 4px; }
input, button { padding: 8px; font: inherit; }
button { background: #286340; color: white; border: 0; border-radius: 7px; cursor: pointer; }
.class-metrics { align-items: stretch; }
.class-metrics article { flex: 1 1 160px; background: #F7FAF3; padding: 12px; border-radius: 8px; }
.class-metrics strong { display: block; font-size: 1.3rem; }
.table { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid #CCDCC8; vertical-align: top; }
progress { width: 7rem; accent-color: #286340; }
details a { display: block; margin-top: 5px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<a href="teacher-home.html">Teacher home</a>
<h1>Class Reports</h1>
<nav aria-label="Results views"><a href="session-results.html">Session History</a> · <a href="class-reports.html" aria-current="page">Class Reports</a></nav>
<section>
<form id="filters">
<label>Teacher access code <input id="token" type="password" required autocomplete="off"></label>
<label>Class code <input name="class_code" list="classCodes" required maxlength="60"></label>
<datalist id="classCodes"></datalist>
<label>From <input name="start" type="date"></label>
<label>To <input name="end" type="date"></label>
<label>Lesson <input name="lesson" maxlength="160"></label>
<label>Learning Target ID <input name="target" maxlength="120"></label>
<button>Load report</button>
</form>
<p id="status" role="status"></p>
</section>
<div id="report" hidden>
<h2 id="classHeading"></h2>
<section><h3>Class overview</h3><div id="metrics" class="class-metrics"></div><p>Mastery means scoring at least 80% on a task. Submission rates use assigned places for each task.</p></section>
<section><h3>Learning targets to review</h3><div id="targets" class="table"></div></section>
<section><h3>Students</h3><div id="students" class="table"></div></section>
<section><h3>Sessions</h3><div id="sessions" class="table"></div></section>
</div>
<script src="config.js"></script>
<script src="class-reports.js?v=1"></script>
</body>
</html>
