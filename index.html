<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root English House</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f3e8, #edf5eb);
      color: #1f2933;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 720px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8f2e4;
      color: #286340;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
    }

    p {
      margin: 14px 0 28px;
      color: #5f6b7a;
      font-size: 16px;
      line-height: 1.6;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
      gap: 14px;
      text-align: left;
    }

    .version {
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid #ccdcca;
      border-radius: 16px;
    }

    .version.pilot { background: #f6faf3; }
    .version h2 { margin: 0; font-size: 21px; }
    .version p { margin: 8px 0 18px; }
    .version .actions { margin-top: auto; text-align: center; }
    a:hover { filter: brightness(.94); }
    a:focus-visible { outline: 3px solid #4d8627; outline-offset: 3px; }

    .actions {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .primary {
      background: #286340;
      color: white;
    }

    .secondary {
      background: #f3f4f6;
      color: #1f2933;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #8a94a6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Classroom Runtime</div>

    <h1>Root English House</h1>

    <p>Choose the version your teacher uses.</p>

    <div class="versions">
      <section class="version" aria-labelledby="current-version">
        <h2 id="current-version">Current version</h2>
        <p>Regular classroom sessions.</p>
        <div class="actions">
          <a class="primary" href="/join.html">Student Join</a>
          <a class="secondary" href="/teacher-home.html">Teacher Start Class</a>
        </div>
      </section>

      <section class="version pilot" aria-labelledby="pilot-version">
        <h2 id="pilot-version">Pilot version</h2>
        <p>Join Classroom, Homework or Test with your Student ID and PIN.</p>
        <div class="actions">
          <a class="primary" href="https://precious-cat-staging.up.railway.app/studio/join.html">Student Join</a>
          <a class="secondary" href="https://precious-cat-staging.up.railway.app/studio/teacher-home.html">Teacher Workspace</a>
        </div>
      </section>
    </div>

    <div class="footer">
      Learn. Speak. Grow.
    </div>
  </main>
</body>
</html>
